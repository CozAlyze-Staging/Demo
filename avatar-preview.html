<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000f26">
<title>Avatar Preview · CozAlyze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* Reading page styles, copied unchanged from vedic-reading.html */
:root {
  --vedic-navy: #000f26;
  --vedic-gold: #d4a178;
  --vedic-gold-muted: rgba(212, 161, 120, 0.65);
  --vedic-ivory: #e5d4c5;
  --vedic-ivory-muted: rgba(229, 212, 197, 0.88);
  --display-font: "Cormorant Garamond", Georgia, serif;
  --body-font: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --side-pad: 28px;
  --dash-zoom: 1;            /* opens showing the whole art, then eases to --dash-zoom-in */
  --dash-zoom-in: 1.3;
}
@media (max-width: 374px) { :root { --side-pad: 20px; } }

* { box-sizing: border-box; }
html { background: var(--vedic-navy); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--vedic-navy);
  color: var(--vedic-ivory);
  font-family: var(--body-font);
  -webkit-font-smoothing: antialiased;
}

/* Fixed background layer: iOS ignores background-attachment on body,
   so the image lives on its own fixed layer behind the scrolling content. */
.vedic-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-color: var(--vedic-navy);
  background-image: url("vedic-moon-bg.png");
  background-size: cover;
  background-position: top center;
  background-repeat: no-repeat;
  pointer-events: none;
}

.vedic-reading-page {
  position: relative;
  z-index: 1;
  min-height: 100svh;
  padding:
    calc(env(safe-area-inset-top) + 24px)
    var(--side-pad)
    calc(env(safe-area-inset-bottom) + 24px);
}

.vedic-reading-content {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  animation: vedicFadeIn 240ms ease-out;
}
@keyframes vedicFadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .vedic-reading-content { animation: none; }
  .stage { transition: none; }
}

/* ---------- header ---------- */
.vedic-back-button {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 10px);
  left: calc(var(--side-pad) - 10px);
  width: 44px;
  height: 44px;
  padding: 0;
  margin: 0;
  border: 0;
  background: transparent;
  color: var(--vedic-gold);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.vedic-back-button svg { width: 30px; height: 20px; display: block; }
.vedic-back-button:focus-visible { outline: 1px solid var(--vedic-gold-muted); outline-offset: 4px; border-radius: 4px; }

.vedic-header {
  text-align: center;
  padding-top: 6px;
}
/* His logo lockup (emblem + CozAlyze wordmark) as one image, white keyed out.
   Width is set so the wordmark reads at the spec's 28–30px display size. */
.vedic-logo {
  display: block;
  width: 140px;
  height: auto;
  margin: 0 auto;
}
.vedic-eyebrow {
  font-family: var(--body-font);
  font-size: clamp(13px, 3.5vw, 14.5px);
  font-weight: 500;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--vedic-ivory-muted);
  margin: 12px 0 0;
  padding-left: 0.28em; /* optical centre with the trailing tracking */
}
.vedic-counter {
  font-family: var(--display-font);
  font-size: clamp(27px, 7.2vw, 31px);
  font-weight: 500;
  letter-spacing: 0.06em;
  font-variant-numeric: lining-nums;
  color: var(--vedic-gold);
  margin: 40px 0 0;
}

/* ---------- ornamental divider ---------- */
.vedic-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: min(100%, 420px);
  margin: 14px auto;
  color: var(--vedic-gold);
}
.vedic-divider::before,
.vedic-divider::after {
  content: "";
  flex: 1 1 auto;
  height: 1px;
  background: var(--vedic-gold-muted);
}
.vedic-divider svg { width: 16px; height: 16px; flex: 0 0 auto; display: block; }

/* ---------- title ---------- */
.vedic-title {
  font-family: var(--display-font);
  font-size: clamp(2.6rem, 11.5vw, 3.4rem);
  font-weight: 500;
  line-height: 0.98;
  color: var(--vedic-gold);
  text-align: center;
  text-wrap: balance;
  margin: 10px 0;
}
.vedic-title--long {
  font-size: clamp(2.35rem, 10vw, 2.9rem);
}

/* ---------- body ---------- */
.vedic-body {
  font-family: var(--body-font);
  font-size: clamp(1.25rem, 5.4vw, 1.4rem);
  line-height: 1.55;
  font-weight: 400;
  color: var(--vedic-ivory);
  margin-top: 24px;
}
.vedic-body p { margin: 0 0 1.35em; }
.vedic-body p:last-child { margin-bottom: 0; }
.vedic-subhead {
  font-family: var(--display-font);
  font-size: clamp(1.6rem, 6.4vw, 1.9rem);
  font-weight: 500;
  line-height: 1.12;
  color: var(--vedic-gold);
  text-align: left;
  margin: 1.6em 0 0.7em;
}
.vedic-body .vedic-subhead:first-child { margin-top: 0; }

/* ---------- bottom navigation ---------- */
.vedic-nav { margin-top: 34px; }
.vedic-nav-rule {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--vedic-gold);
}
.vedic-nav-rule::before,
.vedic-nav-rule::after {
  content: "";
  flex: 1 1 auto;
  height: 1px;
  background: var(--vedic-gold-muted);
}
.vedic-nav-rule svg { width: 14px; height: 14px; flex: 0 0 auto; display: block; }
.vedic-nav-links {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding-top: 6px;
}
.vedic-nav a,
.vedic-nav button {
  font-family: var(--body-font);
  font-size: clamp(16px, 4.3vw, 18px);
  font-weight: 400;
  color: var(--vedic-gold);
  text-decoration: none;
  background: transparent;
  border: 0;
  padding: 0;
  margin: 0;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  text-align: left;
}
.vedic-nav a:focus-visible,
.vedic-nav button:focus-visible { outline: 1px solid var(--vedic-gold-muted); outline-offset: 4px; border-radius: 4px; }
.vedic-nav .vedic-nav-next { text-align: right; justify-content: flex-end; }
.vedic-nav svg:not(.vedic-nav-rule svg) { width: 24px; height: 15px; flex: 0 0 auto; }

</style>
<style>
/* AV0.3 preview only (no labels under the avatars; the Vedic avatars speak, and move once their Simli avatar is ready): the avatar choice at the top of Section 01, and the avatar reading.
   Everything else on this page is the reading page's own styles, unchanged. */
.avatar-choice { margin: 22px 0 4px; text-align: center; }
.avatar-choice-title {
  font-family: var(--display-font);
  font-size: clamp(1.6rem, 6.4vw, 1.9rem);
  font-weight: 500;
  line-height: 1.12;
  color: var(--vedic-gold);
  margin: 0 0 14px;
}
.avatar-options { display: flex; justify-content: center; gap: 18px; }
.avatar-option {
  flex: 0 1 40%;
  max-width: 220px;
  padding: 0;
  margin: 0;
  border: 0;
  background: transparent;
  color: var(--vedic-gold);
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.avatar-option img {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid var(--vedic-gold-muted);
}

.avatar-speaking { margin: 22px 0 0; }
.avatar-speaking img {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid var(--vedic-gold-muted);
}
.av-frame { position: relative; }
.av-frame video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 0%;
  border: 1px solid var(--vedic-gold-muted);
  visibility: hidden;          /* the still picture shows until the first moving frame */
}
.av-frame video.on { visibility: visible; }
.avatar-controls { margin-top: 10px; }
.avatar-controls .vedic-nav-links span {
  font-family: var(--body-font);
  font-size: clamp(16px, 4.3vw, 18px);
  color: var(--vedic-ivory-muted);
}
</style>
</head>
<body data-view="reading">
<div class="vedic-bg" aria-hidden="true"></div>
<main class="vedic-reading-page">
  <button class="vedic-back-button" type="button" aria-label="Back to your reading dashboard">
    <svg viewBox="0 0 30 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M29 10H2M9 3 2 10l7 7"/>
    </svg>
  </button>
  <div class="vedic-reading-content" id="content"></div>
</main>
<script>
(function () {
  /* AV0.3: the Vedic woman (Rashi) and the Vedic man (Rahul S) read the sample aloud from the CozAlyze voice server.
     When an avatar's moving video is ready on the server, it plays in the avatar's place with its own sound;
     otherwise the voice plays over the still picture. ?face=test uses Simli's ready-made test face (testing only).
     The two Tropical avatars stay silent until their voices are chosen. */
  var VOICE_SERVER = "https://cozalyze-voice-server.netlify.app";
  var VOICED = { "vedic-female": true, "vedic-male": true };

  var q = new URLSearchParams(location.search);
  var FACE = q.get("face") === "test" ? "test" : "own";
  var sys = q.get("sys") === "tropical" ? "tropical" : "vedic";
  var state = q.get("state") === "speaking" ? "speaking" : "choose";
  var who = q.get("who") === "male" ? "male" : "female";

  var SYS = {
    vedic:    { eyebrow: "Your Vedic Reading",    title: "Your Essential Nature & Guiding Planet", next: "Your Mind, Intuition & Spiritual Patterning" },
    tropical: { eyebrow: "Your Tropical Reading", title: "At Your Core",                           next: "Love, Desire & Creativity" }
  }[sys];

  var STAR = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0 13.6 10.4 24 12 13.6 13.6 12 24 10.4 13.6 0 12 10.4 10.4Z"/></svg>';
  var ARROW_L = '<svg viewBox="0 0 22 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 7H2M7 2 2 7l5 5"/></svg>';
  var ARROW_R = '<svg viewBox="0 0 22 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 7h19M15 2l5 5-5 5"/></svg>';

  var SAMPLE = [
    "Sample text for this preview. The reading's own paragraphs sit here exactly as they do now, and nothing about them changes.",
    "Once an avatar is chosen, it reads this section aloud from the first line to the last, then turns to the next section and keeps going.",
    "The text stays on the page the whole time, so the reader can follow along, scroll ahead, or simply listen.",
    "All six sections are read once, in order, finishing with the last section of the reading."
  ];

  /* one audio element for the whole page; the first tap on an avatar unlocks it on iPhone */
  var player = new Audio();
  player.preload = "auto";
  player.setAttribute("playsinline", "");
  var part = 0;

  var MOVING = {};          /* avatar -> true once its moving video is ready on the server */
  var useVideo = false;

  function voiced() { return !!VOICED[sys + "-" + who]; }
  function videoUrl(k) { return VOICE_SERVER + "/api/sample-video?avatar=" + k + "&part=all" + (FACE === "test" ? "&face=test" : ""); }
  function vid() { return document.querySelector(".av-frame video"); }
  function playVideo() {
    var v = vid();
    if (!v) return;
    useVideo = true;
    label("Pause");
    var p = v.play();
    if (p && p.catch) p.catch(function () { label("Try again"); });
  }
  function partUrl(n) { return VOICE_SERVER + "/api/sample-audio?avatar=" + sys + "-" + who + "&part=" + n; }
  function label(t) { var b = document.getElementById("avPause"); if (b) b.textContent = t; }

  function playPart(n) {
    part = n;
    player.src = partUrl(n);
    label("Pause");
    var p = player.play();
    if (p && p.catch) p.catch(function () { label("Try again"); });
  }
  player.addEventListener("ended", function () {
    if (part < SAMPLE.length) playPart(part + 1);
    else { part = 0; label("Play again"); }
  });
  player.addEventListener("error", function () { if (state === "speaking" && part) label("Try again"); });

  Object.keys(VOICED).forEach(function (k) {
    if (k.indexOf(sys + "-") !== 0) return;
    fetch(videoUrl(k), { method: "HEAD" }).then(function (r) {
      MOVING[k] = r.ok;
      /* a direct link to the speaking view: add the moving avatar once we know it's there */
      if (r.ok && state === "speaking" && k === sys + "-" + who && !useVideo && player.paused && !vid()) render();
    }).catch(function () {});
  });

  function blockHtml() {
    if (state === "choose") {
      return '<section class="avatar-choice" aria-label="Hear your reading">' +
          '<h2 class="avatar-choice-title">Hear Your Reading</h2>' +
          '<div class="avatar-options">' +
            '<button type="button" class="avatar-option" data-who="male" aria-label="Choose this avatar"><img src="avatars/avatar-' + sys + '-male.jpg" alt="" width="1024" height="1536"></button>' +
            '<button type="button" class="avatar-option" data-who="female" aria-label="Choose this avatar"><img src="avatars/avatar-' + sys + '-female.jpg" alt="" width="1024" height="1536"></button>' +
          '</div>' +
        '</section>';
    }
    var k = sys + "-" + who;
    return '<section class="avatar-speaking" aria-label="Your avatar is reading">' +
        '<div class="av-frame">' +
          '<img src="avatars/avatar-' + sys + '-' + who + '.jpg" alt="" width="1024" height="1536">' +
          (voiced() && MOVING[k] ? '<video playsinline webkit-playsinline preload="auto" src="' + videoUrl(k) + '"></video>' : '') +
        '</div>' +
        '<nav class="vedic-nav avatar-controls" aria-label="Avatar controls">' +
          '<div class="vedic-nav-rule" aria-hidden="true">' + STAR + '</div>' +
          '<div class="vedic-nav-links">' +
            '<button type="button" id="avPause">' + (voiced() ? "Play" : "Pause") + '</button>' +
            '<span>Section 01 of 06</span>' +
            '<button type="button" id="avStop">Stop</button>' +
          '</div>' +
        '</nav>' +
      '</section>';
  }

  function render() {
    document.getElementById("content").innerHTML =
      '<header class="vedic-header">' +
        '<img class="vedic-logo" src="vedic-logo.png" alt="CozAlyze" width="1000" height="1055">' +
        '<p class="vedic-eyebrow">' + SYS.eyebrow + '</p>' +
        '<p class="vedic-counter">01 OF 06</p>' +
      '</header>' +
      '<div class="vedic-divider" aria-hidden="true">' + STAR + '</div>' +
      '<h1 class="' + (SYS.title.length > 22 ? "vedic-title vedic-title--long" : "vedic-title") + '">' + SYS.title + '</h1>' +
      '<div class="vedic-divider" aria-hidden="true">' + STAR + '</div>' +
      blockHtml() +
      '<section class="vedic-body">' + SAMPLE.map(function (p) { return "<p>" + p + "</p>"; }).join("") + '</section>' +
      '<nav class="vedic-nav" aria-label="Reading navigation">' +
        '<div class="vedic-nav-rule" aria-hidden="true">' + STAR + '</div>' +
        '<div class="vedic-nav-links">' +
          '<a href="#">' + ARROW_L + ' Back to Your Reading</a>' +
          '<a class="vedic-nav-next" href="#">Next: ' + SYS.next + ' ' + ARROW_R + '</a>' +
        '</div>' +
      '</nav>';

    var v = vid();
    if (v) {
      v.addEventListener("playing", function () { v.classList.add("on"); });
      v.addEventListener("ended", function () { label("Play again"); });
      v.addEventListener("error", function () { useVideo = false; label("Try again"); });
    }

    Array.prototype.forEach.call(document.querySelectorAll(".avatar-option"), function (b) {
      b.addEventListener("click", function () {
        who = b.getAttribute("data-who");
        state = "speaking";
        try { history.replaceState(null, "", "?sys=" + sys + "&state=speaking&who=" + who + (FACE === "test" ? "&face=test" : "")); } catch (e) {}
        useVideo = false;
        render();
        if (voiced() && vid()) playVideo();    /* inside the tap, so iPhone allows the sound */
        else if (voiced()) playPart(1);
        else label("Pause");
      });
    });

    var pause = document.getElementById("avPause");
    if (pause) pause.addEventListener("click", function () {
      if (!voiced()) { pause.textContent = pause.textContent === "Pause" ? "Resume" : "Pause"; return; }
      var t = pause.textContent;
      var v = vid();
      if (v && (useVideo || t === "Play")) {
        if (t === "Pause") { v.pause(); label("Resume"); }
        else if (t === "Resume") { var r = v.play(); label("Pause"); if (r && r.catch) r.catch(function () { label("Try again"); }); }
        else if (t === "Try again" && v.error) { useVideo = false; playPart(1); }   /* the video failed: the voice alone */
        else { try { v.currentTime = 0; } catch (e) {} playVideo(); }          /* Play, Play again, Try again */
        return;
      }
      if (t === "Pause") { player.pause(); label("Resume"); }
      else if (t === "Resume") { var p = player.play(); label("Pause"); if (p && p.catch) p.catch(function () { label("Try again"); }); }
      else playPart(t === "Try again" && part ? part : 1);   /* Play, Play again, Try again */
    });

    var stop = document.getElementById("avStop");
    if (stop) stop.addEventListener("click", function () {
      player.pause();
      var v = vid();
      if (v) v.pause();
      useVideo = false;
      part = 0;
      state = "choose";
      try { history.replaceState(null, "", "?sys=" + sys + "&state=choose" + (FACE === "test" ? "&face=test" : "")); } catch (e) {}
      render();
    });
  }

  render();
})();
</script>
</body>
</html>
