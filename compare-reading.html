<style>
/* ============================================================
   COZALYZE · COMPARE · COMBINED READING · C3.6 · early generation
   Paid dashboard + reveal + six reading sections in ONE document
   (standing rule: no iframe, no page navigation between them).
   Design tokens and structure follow the supplied spec verbatim.
   ============================================================ */
:root {
  --vedic-navy: #000f26;
  --vedic-gold: #d4a178;
  --vedic-gold-muted: rgba(212, 161, 120, 0.65);
  --vedic-ivory: #e5d4c5;
  --vedic-ivory-muted: rgba(229, 212, 197, 0.88);
  --display-font: "Cormorant Garamond", Georgia, serif;
  --body-font: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --side-pad: 28px;
  --dash-zoom: 1;            /* C1.3: opens showing the WHOLE frame like the Vedic and Tropical dashboards, then eases to --dash-zoom-in */
  --dash-zoom-in: 1.17;   /* GD1 (Oct 25): the whole new art first, then the same ease-in as Vedic and Tropical (same delay, length and curve).
                             His new art has no black border, so it lands at 1.17, not their 1.3: at 1.3 "Compare Your Charts"
                             and TROPICAL / VEDIC would be cut at the screen edges. At 1.17 they clear the edges and the nav
                             pill sits just below the screen, as on Vedic and Tropical. (Was 1.34 on the old letterboxed frame.) */
  --reveal-zoom: 1.23;    /* the clip zooms itself in over its first second, so the stage eases back to cover-fit */
}
@media (max-width: 374px) { :root { --side-pad: 20px; } }

* { box-sizing: border-box; }
html { background: var(--vedic-navy); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--vedic-navy);
  color: var(--vedic-ivory);
  font-family: var(--body-font);
  -webkit-font-smoothing: antialiased;
}

/* Fixed background layer: iOS ignores background-attachment on body,
   so the image lives on its own fixed layer behind the scrolling content. */
.vedic-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-color: var(--vedic-navy);
  background-image: url("compare-moon-bg.png?v=11");   /* his sun-and-moon medallion backdrop for the Combined reading */
  background-size: cover;
  background-position: top center;
  background-repeat: no-repeat;
  pointer-events: none;
}

.vedic-reading-page {
  position: relative;
  z-index: 1;
  min-height: 100svh;
  padding:
    calc(env(safe-area-inset-top) + 24px)
    var(--side-pad)
    calc(env(safe-area-inset-bottom) + 24px);
}

.vedic-reading-content {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  animation: vedicFadeIn 240ms ease-out;
}
@keyframes vedicFadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .vedic-reading-content { animation: none; }
  .stage { transition: none; }
}

/* ---------- header ---------- */
.vedic-back-button {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 10px);
  left: calc(var(--side-pad) - 10px);
  width: 44px;
  height: 44px;
  padding: 0;
  margin: 0;
  border: 0;
  background: transparent;
  color: var(--vedic-gold);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.vedic-back-button svg { width: 30px; height: 20px; display: block; }
.vedic-back-button:focus-visible { outline: 1px solid var(--vedic-gold-muted); outline-offset: 4px; border-radius: 4px; }

.vedic-header {
  text-align: center;
  padding-top: 6px;
}
/* His logo lockup (emblem + CozAlyze wordmark) as one image, white keyed out.
   Width is set so the wordmark reads at the spec's 28–30px display size. */
.vedic-logo {
  display: block;
  width: 140px;
  height: auto;
  margin: 0 auto;
}
.vedic-eyebrow {
  font-family: var(--body-font);
  font-size: clamp(13px, 3.5vw, 14.5px);
  font-weight: 500;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--vedic-ivory-muted);
  margin: 12px 0 0;
  padding-left: 0.28em; /* optical centre with the trailing tracking */
}
.vedic-counter {
  font-family: var(--display-font);
  font-size: clamp(27px, 7.2vw, 31px);
  font-weight: 500;
  letter-spacing: 0.06em;
  font-variant-numeric: lining-nums;
  color: var(--vedic-gold);
  margin: 40px 0 0;
}

/* ---------- ornamental divider ---------- */
.vedic-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: min(100%, 420px);
  margin: 14px auto;
  color: var(--vedic-gold);
}
.vedic-divider::before,
.vedic-divider::after {
  content: "";
  flex: 1 1 auto;
  height: 1px;
  background: var(--vedic-gold-muted);
}
.vedic-divider svg { width: 16px; height: 16px; flex: 0 0 auto; display: block; }

/* ---------- title ---------- */
.vedic-title {
  font-family: var(--display-font);
  font-size: clamp(2.6rem, 11.5vw, 3.4rem);
  font-weight: 500;
  line-height: 0.98;
  color: var(--vedic-gold);
  text-align: center;
  text-wrap: balance;
  margin: 10px 0;
}
.vedic-title--long {
  font-size: clamp(2.35rem, 10vw, 2.9rem);
}

/* ---------- body ---------- */
.vedic-body {
  font-family: var(--body-font);
  font-size: clamp(1.25rem, 5.4vw, 1.4rem);
  line-height: 1.55;
  font-weight: 400;
  color: var(--vedic-ivory);
  margin-top: 24px;
}
.vedic-body p { margin: 0 0 1.35em; }
/* PROVISIONAL layout for the three parts of a Combined section: reuses the existing
   eyebrow and divider styles only, no new visual elements, until the compare reading is designed. */
.vedic-body .vedic-part-label { text-align: center; margin: 0 0 1.1em; color: var(--vedic-gold); font-size: clamp(12px, 3.2vw, 13.5px); }
.vedic-body .vedic-divider--part { margin: 0.4em auto 1.4em; }
.vedic-body p:last-child { margin-bottom: 0; }

/* ---------- bottom navigation ---------- */
.vedic-nav { margin-top: 34px; }
.vedic-nav-rule {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--vedic-gold);
}
.vedic-nav-rule::before,
.vedic-nav-rule::after {
  content: "";
  flex: 1 1 auto;
  height: 1px;
  background: var(--vedic-gold-muted);
}
.vedic-nav-rule svg { width: 14px; height: 14px; flex: 0 0 auto; display: block; }
.vedic-nav-links {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding-top: 6px;
}
.vedic-nav a,
.vedic-nav button {
  font-family: var(--body-font);
  font-size: clamp(16px, 4.3vw, 18px);
  font-weight: 400;
  color: var(--vedic-gold);
  text-decoration: none;
  background: transparent;
  border: 0;
  padding: 0;
  margin: 0;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  text-align: left;
}
.vedic-nav a:focus-visible,
.vedic-nav button:focus-visible { outline: 1px solid var(--vedic-gold-muted); outline-offset: 4px; border-radius: 4px; }
.vedic-nav .vedic-nav-next { text-align: right; justify-content: flex-end; }
.vedic-nav svg:not(.vedic-nav-rule svg) { width: 24px; height: 15px; flex: 0 0 auto; }

/* ============================================================
   PAID DASHBOARD  (his art = frame 0 of the reveal clip, so the
   dashboard and the video's first frame are pixel-identical)
   ============================================================ */
body[data-view="dashboard"] .vedic-reading-page,
body[data-view="dashboard"] .vedic-bg { display: none; }
body[data-view="reading"] .dash { display: none; }

.dash {
  position: fixed;
  inset: 0;
  z-index: 5;
  background: #000;   /* this clip's first frame carries a black border */
  overflow: hidden;
}
/* one shared stage: contain-fit box with the clip's exact aspect, centred */
.stage {
  position: absolute;
  left: 50%;
  top: 50%;
  aspect-ratio: 1084 / 1908;
  width: min(100vw, calc(100svh * 1084 / 1908));   /* contain-fit: the whole art */
  /* --dash-zoom 1 = whole art; above 1 the stage scales up around its centre and
     crops evenly. Done with transform so iOS animates it smoothly. */
  transform: translate(-50%, -50%) scale(var(--dash-zoom, 1));
  transition: transform 1400ms cubic-bezier(0.22, 0.61, 0.36, 1);
  will-change: transform;
}
html.reveal-zooming .stage {
  transition: transform 900ms linear;   /* counter-zoom while the clip zooms itself in */
  container-type: inline-size;
  overflow: hidden;
}
.stage-art,
.stage video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  display: block;
  background: var(--vedic-navy);
}
.stage video { background: transparent; }   /* the art under it shows until the first frame paints */
.hot {
  position: absolute;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  color: transparent;
  font-size: 0;
}
.hot:focus-visible { outline: 1px solid var(--vedic-gold-muted); outline-offset: 2px; border-radius: 8px; }
.hot[disabled] { cursor: default; }
/* live ascendant: shown ONLY when the sign is not the sample Leo baked into the art */
.asc-patch, .asc-glyph, .asc-label { position: absolute; display: none; pointer-events: none; }
.stage[data-asc-live="1"] .asc-patch,
.stage[data-asc-live="1"] .asc-glyph,
.stage[data-asc-live="1"] .asc-label { display: block; }
/* geometry measured on the 1084-wide letterboxed frame, all in cqw:
   baked Leo glyph ring centred (303,1240), ring outer radius ~34; no sign label on this art */
.asc-patch-glyph {
  left: 25.55cqw; top: 111.99cqw;
  width: 4.8cqw; height: 4.8cqw;
  border-radius: 50%;
  background: radial-gradient(circle, rgb(5,17,33) 0 66%, rgba(5,17,33,0) 100%);
}
.asc-patch-text { display: none !important; }
.asc-label { display: none !important; }
.asc-glyph {
  left: 25.55cqw; top: 111.99cqw;
  width: 4.8cqw; height: 4.8cqw;
  font: 400 3.1cqw/4.8cqw "Cormorant Garamond", "Apple Symbols", "Segoe UI Symbol", serif;
  text-align: center;
  color: #d9b48a;
}
.dash-preparing .hot-reading { opacity: 0.45; }

/* ============================================================
   REVEAL OVERLAY  (video plays once, then everything disappears
   and the reading emerges)
   ============================================================ */
.reveal {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #000;
  overflow: hidden;
  display: none;
}
.reveal.is-on { display: block; }
.reveal .asc-patch, .reveal .asc-glyph, .reveal .asc-label { transition: opacity 320ms ease-out; }
.reveal.asc-off .asc-patch, .reveal.asc-off .asc-glyph, .reveal.asc-off .asc-label { opacity: 0; }
.reveal.is-pulling .asc-patch, .reveal.is-pulling .asc-glyph, .reveal.is-pulling .asc-label { opacity: 0; }   /* CRG2 r5: nothing stays behind the pull-away */
.reveal-curtain {
  position: absolute;
  inset: 0;
  background: var(--vedic-navy);
  opacity: 0;
  transition: opacity 480ms ease-in;
  pointer-events: none;
}
.reveal.is-closing .reveal-curtain { opacity: 1; }
.reveal-back {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 10px);
  left: 18px;
  width: 44px;
  height: 44px;
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--vedic-gold);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.reveal-back svg { width: 30px; height: 20px; display: block; }
.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
body.scroll-locked { overflow: hidden; touch-action: none; }

/* ---------- build stamp (project standing rule) ---------- */
.vedic-stamp {
  position: fixed;
  right: 8px;
  bottom: calc(env(safe-area-inset-bottom) + 4px);
  z-index: 2;
  font: 9px/1 var(--body-font);
  letter-spacing: 0.08em;
  color: rgba(212, 161, 120, 0.35);
  pointer-events: none;
}
/* ---------- dashboard pinch zoom (Sep 1): the landing eases to --dash-zoom-in, which
   pushes the bottom nav pill below the screen; two fingers now zoom the art between
   the whole frame (1) and the landing (--dash-zoom-in) so Home, Saved and Account can
   always be reached. Native browser zoom stays off. ---------- */
.dash { touch-action: none; }
.dash.pinching .stage { transition: none; }

/* one-finger pan (Sep 1): when the dashboard is zoomed in, dragging moves the art up
   and down within its edges so the bottom nav pill can be pulled into view */
.stage { transform: translate(-50%, calc(-50% + var(--dash-pan, 0px))) scale(var(--dash-zoom, 1)); }
.dash.panning .stage { transition: none; }
@keyframes cozPageIn { from { opacity: 0; } to { opacity: 1; } }
body[data-view="reading"] .vedic-reading-page { animation: none; }
.reveal-curtain { transition: opacity 1400ms ease-in-out; }

/* through the sun (Sep 1 ruling): after the burst the camera keeps going, the sun
   fills the screen with light and the reading emerges out of it */
/* the sun sits at 40.7% of the clip height (measured on the last frame): the drive scales about it */
.reveal.is-through .stage { transform-origin: 50% 40.7%; transition: transform 3200ms cubic-bezier(0.42, 0, 0.9, 0.35), transform-origin 0s;
  /* the sun is carried to the exact screen centre while the stage grows about it */
  transform: translate(-50%, calc(-50% + 9.3%)) scale(calc(var(--dash-zoom, 1) * 5.5)); }
.reveal.is-through .reveal-curtain { background: radial-gradient(circle at 50% 50%, #fff6df 0%, #f1d9a6 45%, #e4b978 100%); transition: opacity 1400ms ease-in; }
#cozLight { position: fixed; inset: 0; z-index: 90; pointer-events: none; opacity: 0;
  background: radial-gradient(circle at 50% 42%, #fff6df 0%, #f1d9a6 45%, #e4b978 100%); transition: opacity 1800ms ease-out; }
#cozLight.on { opacity: 1; transition: none; }
/* text zoom (Sep 1 ruling): wherever there is reading text, two fingers scale it up
   to 2x and back; the text reflows, nothing else on the page zooms */
#vedicContent, #asqContent .wrap { zoom: var(--coz-text-zoom, 1); }

/* Sep 20: the reveal stage un-zooms from the dashboard's 1.3 to 1 while the gold
   light covers the screen, so the flight plays full size instead of cropped. */
#revealStage, #tropicalRevealStage, #compareRevealStage,
.reveal .stage {
  transform: translate(-50%, calc(-50% + var(--dash-pan, 0px))) scale(var(--reveal-zoom, var(--dash-zoom, 1)));
  transition: transform 1300ms cubic-bezier(0.33, 0, 0.2, 1);
}
/* CRG2 (Oct 14, Jason's ruling): the waiting line, ONLY when Shared Themes is not ready yet.
   His existing "Calculating your sky" line from index.html, same style (.gn-title .t1) and the same
   pulse used by "Tap the Sky" (twinkle 3.2s). Nothing else is drawn. */
@keyframes cozTwinkle { 0%,100%{opacity:1} 50%{opacity:.45} }
.reveal .coz-wait { position:absolute; left:0; right:0; bottom:22vh; text-align:center; z-index:5;   /* WL1: was 14vh */
  text-shadow:0 2px 14px rgba(0,0,0,.85); pointer-events:none; opacity:0; transition:opacity 1.2s ease; }
.reveal .coz-wait .t1 { font-family:Georgia,serif; font-size:17px; letter-spacing:.14em; color:#E8C7A6; }
.reveal .coz-wait.on { opacity:1; }
.reveal .coz-wait.on .t1 { animation:cozTwinkle 3.2s ease-in-out 1.2s infinite; }
.reveal .coz-wait.on.wl-swap { opacity:0; }   /* WL1: the line's own fade, out and back in, when its words change */
/* CRG2 r5: with reduced motion there is no clip to recede, so the waiting screen is shown at once, line included */
@media (prefers-reduced-motion: reduce) { .reveal .coz-wait { transition: none; } }
</style>

<style id="coz-gd1">
/* GD1 (Oct 25 2026, staging only): Jason's IMG_3933 is the Compare dashboard art (compare-dashboard.jpg,
   813 x 1763: the whole arch through the bottom nav). The dashboard stage takes its shape, so the whole
   image is shown first and then eases in the same way as Vedic and Tropical (same delay, length and curve;

}
/* the baked Leo on this art: ring centred (184,1198), outer ring radius ~36, inner dotted ring ~31; in cqw of 813 */
#dashStage .asc-patch-glyph {
  left: 18.97cqw; top: 143.70cqw;
  width: 7.38cqw; height: 7.38cqw;
  background: radial-gradient(circle, rgb(12,19,34) 0 86%, rgba(12,19,34,0) 100%);
}
#dashStage .asc-glyph {
  left: 18.97cqw; top: 143.70cqw;
  width: 7.38cqw; height: 7.38cqw;

}
</style>

<script>
/* ============================================================
   SECTION DATA (spec, verbatim)

   A plain body[] is also accepted and rendered as one run of paragraphs. */
const PART_LABELS = [["tropicalPerspective", "Tropical Perspective"], ["vedicPerspective", "Vedic Perspective"], ["completeView", "Complete View"]];
function readingFromContract(obj) {
  if (!obj || typeof obj !== "object") return null;
  if (Array.isArray(obj.sections)) {
    const map = {};
    obj.sections.forEach(sec => {
      if (!sec || !sec.id) return;
      if (PART_LABELS.some(([k]) => Array.isArray(sec[k]))) map[sec.id] = { parts: PART_LABELS.filter(([k]) => Array.isArray(sec[k])).map(([k, label]) => ({ label, paragraphs: sec[k] })) };
      else if (Array.isArray(sec.body)) map[sec.id] = sec.body;
    });
    return map;
  }
  return obj;
}
function isCustomerReading(obj) { return !!obj && typeof obj === "object" && obj.fixture !== true && obj.sample !== true; }

function loadReading() {
  if (isCustomerReading(window.COZ_COMPARE_READING)) return readingFromContract(window.COZ_COMPARE_READING);
  try {
    const stored = JSON.parse(localStorage.getItem("cozCompareReading") || "null");
    if (isCustomerReading(stored)) return readingFromContract(stored);
  } catch (e) {}
  return readingFromContract(COZ_COMPARE_SAMPLE_READING);   // SAMPLE / FIXTURE, last resort only
}

/* CRG2 r5 (Oct 17, after Chat's review of r4; his approved movement, timing and line are unchanged):
   - The pull-away recedes the reveal's dashboard art AND the clip together (pullLayers), the Ascendant overlays go
     with them (.reveal.is-pulling), a curtain left by a stalled clip is cleared, and at the end the whole reveal

const CRG_VERSION = "CRG2 r5";
const PULL_AT_S = 40.0, PULL_MS = 9000;
let crgHold = null, pullRaf = 0, pullOn = false, pullWatch = 0, landedDark = false;
/* the timing record (never allowed to affect the reveal) */
function tm(fn) { try { const T = window.COZ_CMP_TIMING; if (T && T[fn]) return T[fn].apply(T, [].slice.call(arguments, 1)); } catch (e) {} }
function firstState() {

function pullLayers() { return Array.from(document.querySelectorAll("#revealStage .stage-art, #revealVideo")); }
/* start the pull-away from wherever the picture is now; only ever called while Shared Themes is not ready */
function startPullAway(from) {
  revealEl.classList.remove("is-closing");                            /* r5: black, never a curtain colour (also when already pulling) */
  if (pullOn) return;
  pullOn = true;
  tm("waitStart", "pullStart", "the waiting screen was shown (Shared Themes not ready)", { from: from || "clip", clipAt: Math.round((revealVideo.currentTime || 0) * 10) / 10 });
  revealEl.classList.add("is-on", "is-pulling");                      /* r5: reduced motion never showed the overlay: black, the line and Back need it */
  const L = pullLayers(), w = document.getElementById("cozWait"), stage = document.getElementById("revealStage");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  waitLine(true);                                                     /* WL1: the line (normally already on since 2 s into the clip) */
  console.log("[COZ CRG2] Shared Themes not ready: pulling away into the dark");
  /* Shared Themes may arrive while the picture is still receding: that closes the waiting-screen record at once
     (the landing itself still comes from the clip's end, as before) */
  pullWatch = setInterval(() => { const s = firstState(); if (s !== "wait") { clearInterval(pullWatch); pullWatch = 0; tm("closeWaits", "shared themes " + s); } }, 250);
  if (reduced) { stage.style.visibility = "hidden"; w.classList.add("on"); return; }   /* r5: the final screen at once */
  const t0 = performance.now();
  const step = (now) => {
    if (!pullOn) return;
    const u = Math.min(1, (now - t0) / PULL_MS);
    const sc = Math.exp(-5.3 * Math.pow(u, 1.6));                     /* starts slowly, keeps falling away */
    const a = u < 0.8 ? 1 : Math.max(0, 1 - (u - 0.8) / 0.2);          /* the last of it fades to nothing */
    const e = Math.min(1, (now - t0) / 1500);                           /* edges soften as it starts to recede */
    const rx = 150 - 106 * e, ry = 140 - 98 * e;

      v.style.transform = "scale(" + sc.toFixed(4) + ")";
      v.style.opacity = a.toFixed(3);
      v.style.webkitMaskImage = v.style.maskImage = "radial-gradient(ellipse " + rx + "% " + ry + "% at 50% 50%, #000 70%, transparent 100%)";
    });
    if (u >= 1) { stage.style.visibility = "hidden"; w.classList.add("on"); pullRaf = 0; return; }
    pullRaf = requestAnimationFrame(step);
  };
  pullRaf = requestAnimationFrame(step);
}
function stopPullAway() {
  const was = pullOn;
  pullOn = false; if (pullRaf) cancelAnimationFrame(pullRaf); pullRaf = 0;
  if (pullWatch) { clearInterval(pullWatch); pullWatch = 0; }
  pullLayers().forEach((v) => { ["transform", "opacity", "visibility", "maskImage", "webkitMaskImage"].forEach((k) => { v.style[k] = ""; }); });
  const stage = document.getElementById("revealStage");
  stage.style.visibility = "";
  if (was) stage.style.removeProperty("--reveal-zoom");               /* r5: the next reveal starts from the dashboard's own zoom */
  revealEl.classList.remove("is-pulling");
  waitLine(false);                                                    /* WL1 */
}
/* WL1 (Oct 26 2026, Jason's ruling, staging only): the waiting line now also shows during the reveal itself, a little
   higher (22vh from the bottom, was 14vh), same size, colour and pulse. Two lines only: "Calculating reading" from 2 s
   into the clip, then at 20 s the same 1.2 s fade out and back in to "Your reading will be done shortly", which stays
   (through the dark wait, if there is one) until the reading opens. It shows only while Shared Themes is not
   ready, so a finished reading never shows it; if it is ready during the clip the line leaves, and it leaves with every
   landing and Back. Nothing else changes: the clip, the waiting and the landing are as before. */
const WL_FIRST = "Calculating reading", WL_SECOND = "Your reading will be done shortly";
let wlTimer = 0, wlWatch = 0;
function wlNotReady() { return firstState() === "wait"; }
function waitLine(on) {
  const w = document.getElementById("cozWait"), t1 = w.querySelector(".t1"), live = document.getElementById("revealLive");
  if (!on) {
    if (wlTimer) { clearTimeout(wlTimer); wlTimer = 0; }
    if (wlWatch) { clearInterval(wlWatch); wlWatch = 0; }
    w.classList.remove("on", "wl-swap"); t1.textContent = WL_FIRST;
    return;
  }
  if (wlWatch) return;                                            /* already showing: it keeps its own timing */
  t1.textContent = WL_FIRST; w.classList.remove("wl-swap"); w.classList.add("on"); live.textContent = WL_FIRST;
  wlTimer = setTimeout(() => {                                    /* 18 s after it came in, 20 s into the clip */
    w.classList.add("wl-swap");                                   /* out with the line's own 1.2 s fade, back in with the new words */
    wlTimer = setTimeout(() => { wlTimer = 0; t1.textContent = WL_SECOND; live.textContent = WL_SECOND; w.classList.remove("wl-swap"); }, 1200);
  }, 18000);
  wlWatch = setInterval(() => { if (!pullOn && !wlNotReady()) waitLine(false); }, 500);
}
/* r5: give control back after a landing from the black screen that has not left the page: stop that page load
   first, so it can never arrive later and interrupt a new reveal, then restore. Back, or the 15 s recovery when the
   reading never arrives (this concerns loading the reading after Shared Themes is ready; the wait itself has no limit). */
function stopDarkLanding(why) {
  if (!landedDark) return;
  try { window.stop(); } catch (e) {}
  tm("landingStopped", why);
  restoreDark();
}
function restoreDark() {
  if (!landedDark) return;
  landedDark = false;
  stopPullAway();
  revealEl.classList.remove("is-on", "is-closing", "asc-off", "is-through");
  try { revealVideo.pause(); } catch (e) {}
  lockScroll(false);
  revealActive = false;
  syncReadyState();
  showDashboard();                                    /* the dashboard's own zoom, as after Back */
}
/* the decision point: 40 s into the clip, only if Shared Themes is not ready */
revealVideo.addEventListener("timeupdate", () => {
  if (!revealActive) return;
  tm("seen");                                                          /* r5: when this device first knew Shared Themes was ready */
  if (pullOn || revealVideo.currentTime < PULL_AT_S) return;
  if (firstState() === "wait") startPullAway("clip");
});                                   /* the current wait's token, or null */
function cancelFirstWait(why) {
  if (!crgHold) return false;
  clearInterval(crgHold.timer); crgHold = null;
  console.log("[COZ CRG1] wait cancelled: " + (why || "back"));
  return true;
}
function cmpPairNow() {
  try { const bd = JSON.parse(localStorage.getItem("emergeBirthData") || "null");
    return bd && bd.runId && bd.fingerprint ? { runId: bd.runId, fingerprint: bd.fingerprint } : null; } catch (e) { return null; }
}
function whenFirstSection(go) {
  const CS = window.COZ_CMP_SERVER, pair = cmpPairNow();
  const state = firstState;
  const s0 = state();
  if (s0 !== "wait") { tm("closeWaits", "shared themes " + s0); go(); return; }   /* ready: lands exactly as before, nothing extra shown */
  try { CS.watchFirst(pair); } catch (e) {}
  startPullAway("hold");                                             /* not ready: into the dark (no-op if already pulling) */
  tm("waitStart", "holdStart", "the landing waited for Shared Themes after the reveal");   /* r5: fails the run for good */
  const t0 = Date.now(), tok = {};
  cancelFirstWait("replaced");
  crgHold = tok;
  console.log("[COZ CRG1] holding the landing for Shared Themes");
  tok.timer = setInterval(() => {
    if (crgHold !== tok) { clearInterval(tok.timer); return; }      /* r3: cancelled, never navigate */
    const s = state();
    if (s !== "wait") {                                              /* CRG2: no time limit */
      clearInterval(tok.timer); crgHold = null;
      console.log("[COZ CRG1] landing: " + s + " after " + (Date.now() - t0) + " ms");
      tm("closeWaits", "shared themes " + s);
      go();
    }
  }, 250);
}

/* how: ended (the clip played to its end) | reduced (no clip) | stall | error | noplay | nostart */
function finishReveal(immediate, how) {
  if (!revealActive || revealDone) return;   // ignore clip events while the reveal is not running
  revealDone = true;
  revealTimers.forEach(clearTimeout); revealTimers = [];
  tm("mark", "revealDone", { how: how || (immediate === true ? "ended" : "stall") });   /* r5: with the Shared Themes state now */
  const land0 = () => {
    const dark = pullOn;                        /* r5: after the waiting screen, open the reading straight from black */
    tm("end", "landed");
    location.href = readingPageHref();          // C2.5: opens Your Combined Reading
    if (dark) { landedDark = true; revealTimers.push(setTimeout(() => stopDarkLanding("recovery"), 15000)); return; }   /* restored on pageshow, or after 15 s if the page never left */
    stopPullAway();                             /* CRG2 */
    revealEl.classList.remove("is-on", "is-closing", "asc-off");
    try { revealVideo.pause(); } catch (e) {}
    lockScroll(false);
    revealActive = false;
    syncReadyState();
  };
  const land = () => whenFirstSection(land0);   /* CRG1 */
  /* r5: a stall or error while Shared Themes is not ready (or during the pull-away) never goes through the curtain:
     straight to the black waiting screen. The curtain below stays for a stall when Shared Themes is ready, as before. */
  if (immediate === true || pullOn || firstState() === "wait") { land(); return; }
  /* Sep 1 ruling: through the sun. Hold on the burst, then the camera drives into it, the light
     fills the screen, the page lands underneath and the light clears to reveal the reading. */
  if (immediate === "through"){
    try { window.__cozLightIn(); } catch (e) {}
    land();
    return;
  }
  /* stall or error before the drive began: plain curtain */
  revealEl.classList.add("is-closing");
  revealTimers.push(setTimeout(land, 900));           /* r3: tracked, so leaving the page can clear it */
}

function cancelReveal(why) {
  if (!revealActive) return;
  /* r5: Back while the reading is opening from the black screen: stop that page load and stay on the dashboard */
  if (landedDark) { stopDarkLanding("back"); return; }
  const holding = cancelFirstWait("back");            /* r3: Back works during the Shared Themes wait */
  if (revealDone && !holding) return;
  tm("end", typeof why === "string" ? why : "back");   /* r5: closes any wait record with its own duration */
  if (holding) { try { window.__cozLightOut(); } catch (e) {} }
  stopPullAway();                                     /* CRG2 */
  revealDone = true;
  revealTimers.forEach(clearTimeout); revealTimers = [];
  document.documentElement.classList.remove("reveal-zooming");
  document.documentElement.style.setProperty("--dash-zoom", getComputedStyle(document.documentElement).getPropertyValue("--dash-zoom-in").trim() || "1.34");
  try { revealVideo.pause(); revealVideo.currentTime = 0; } catch (e) {}
  revealEl.classList.remove("is-on", "is-closing", "is-through", "asc-off");
  lockScroll(false);
  revealActive = false;
  syncReadyState();
}

/* C2.5 (his ruling, Sep 19): the chart-opening sunburst belongs to the FIRST tab.
   Your Combined Reading plays it and lands on combined-reading.html.
   Your Ascendants opens its page directly, no reveal. */
document.getElementById("hotReading").addEventListener("click", startReveal);
document.querySelector('[data-dash="ascendant"]').addEventListener("click", function () {
  location.href = "your-ascendants.html";
});
document.getElementById("revealBack").addEventListener("click", cancelReveal);
revealVideo.addEventListener("ended", () => finishReveal(true, "ended"));   /* the clip ends on open space, the reading is already underneath */
revealVideo.addEventListener("error", () => finishReveal(false, "error"));

/* Section links are plain hash links: every section is its own history entry,
   so the phone's back gesture steps through them, and back past Page 01 lands on the dashboard. */
window.addEventListener("hashchange", showFromHash);
/* C2.1: coming Back from Your Ascendants restores this page from Safari's cache with the
   light still up, so clear the reveal and show the dashboard again */
/* r3: leaving the page (or a hash change) ends a Shared Themes wait; it never lands later */
window.addEventListener("pagehide", () => {
  cancelFirstWait("pagehide");
  if (revealActive) tm("end", "left the page");      /* r5: no-op after a landing (already ended) */
  if (revealActive && revealDone) { revealTimers.forEach(clearTimeout); revealTimers = []; }   /* a landing still pending: never fires after leaving */
});
window.addEventListener("hashchange", () => { if (crgHold) cancelReveal("hash change"); });
window.addEventListener("pageshow", e => {
  if (!e.persisted) return;
  cancelFirstWait("pageshow");
  tm("end", "returned");                              /* r5: no-op unless an attempt was still open */
  landedDark = false;                                 /* r5: the restore below covers a dark landing too */
  stopPullAway();                                     /* CRG2 */
  revealTimers.forEach(clearTimeout); revealTimers = [];
  revealActive = false; revealDone = false;
  revealEl.classList.remove("is-on", "is-closing", "asc-off", "is-through");
  try { window.__cozLightOut(); } catch (err) {}

/* ---------- dashboard pinch zoom (Sep 1) ---------- */
(function(){
  const dash = document.getElementById("dash"), root = document.documentElement;
  let active = false, startD = 0, startZ = 1, maxZ = 1.3;
  const cur = () => parseFloat(getComputedStyle(root).getPropertyValue("--dash-zoom")) || 1;
  const dist = e => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  dash.addEventListener("touchstart", e => {
    if (e.touches.length !== 2) return;
    active = true; startD = dist(e) || 1; startZ = cur();
    maxZ = parseFloat(getComputedStyle(root).getPropertyValue("--dash-zoom-in")) || 1.3;
    dash.classList.add("pinching"); window.__dashZoomed = true;
  }, { passive:true });
  dash.addEventListener("touchmove", e => {
    if (!active || e.touches.length !== 2) return;
    e.preventDefault();
    const z = Math.min(maxZ, Math.max(1, startZ * (dist(e) / startD)));
    root.style.setProperty("--dash-zoom", z.toFixed(3));
  }, { passive:false });
  const end = () => { if (!active) return; active = false; dash.classList.remove("pinching"); };
  dash.addEventListener("touchend", end); dash.addEventListener("touchcancel", end);
})();

/* zoom lock (Sep 1): iOS lets a two-finger pinch zoom the whole page even with
   user-scalable=no, and that zoom survives a reload, which is what threw the globe
   off on the second run. Native page zoom is refused here; the dashboards keep
   their own two-finger art zoom. */
(function(){
  ['gesturestart','gesturechange','gestureend'].forEach(function(t){ document.addEventListener(t, function(e){ e.preventDefault(); }, { passive:false }); });
  document.addEventListener('touchmove', function(e){ if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive:false });
})();

/* ---------- one-finger pan on the zoomed dashboard (Sep 1) ---------- */
(function(){
  const dash = document.getElementById("dash"), stage = document.getElementById("dashStage"), root = document.documentElement;
  let panning = false, startY = 0, startPan = 0, moved = false;
  const zoom = () => parseFloat(getComputedStyle(root).getPropertyValue("--dash-zoom")) || 1;
  const pan = () => parseFloat(getComputedStyle(root).getPropertyValue("--dash-pan")) || 0;
  const limit = () => Math.max(0, (stage.offsetHeight * zoom() - window.innerHeight) / 2);
  dash.addEventListener("touchstart", e => {
    if (e.touches.length !== 1 || zoom() <= 1.001) return;
    panning = true; moved = false; startY = e.touches[0].clientY; startPan = pan();
  }, { passive:true });
  dash.addEventListener("touchmove", e => {
    if (!panning || e.touches.length !== 1) return;
    const dy = e.touches[0].clientY - startY;
    if (Math.abs(dy) > 6) moved = true;
    if (!moved) return;
    e.preventDefault(); dash.classList.add("panning");
    const L = limit(); const y = Math.max(-L, Math.min(L, startPan + dy));
    root.style.setProperty("--dash-pan", y.toFixed(1) + "px");
  }, { passive:false });
  const end = () => { panning = false; dash.classList.remove("panning"); };
  dash.addEventListener("touchend", end); dash.addEventListener("touchcancel", end);
  /* a real drag must not count as a tap on the hotspot underneath */
  dash.addEventListener("click", e => { if (moved){ e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
})();


/* ---------- through the sun + text zoom (Sep 1) ---------- */
(function(){

(function(){

/* Sep 20: un-zoom the reveal stage during the gold light (3.6s in), restore on exit. */
(function () {
  var st = document.querySelector(".reveal .stage");
  if (!st) return;
  var t = null;
  var vid = document.querySelector(".reveal video");
  if (!vid) return;
  function unzoom() {
    var w = st.offsetWidth, h = st.offsetHeight;
    if (!w || !h) return;
    var cover = Math.max(window.innerWidth / w, window.innerHeight / h);
    if (!isFinite(cover) || cover < 1) cover = 1;
    cover = Math.min(cover, 1.3);
    st.style.setProperty("--reveal-zoom", cover.toFixed(4));
  }
  function reset() { clearTimeout(t); st.style.removeProperty("--reveal-zoom"); }
  vid.addEventListener("playing", function () { clearTimeout(t); t = setTimeout(unzoom, 3600); });
  vid.addEventListener("ended", function () { if (!pullOn) reset(); });   /* CRG2: no zoom jump during the pull-away */
  vid.addEventListener("error", reset);
  vid.addEventListener("pause", function () { if (vid.currentTime === 0) reset(); });
})();
