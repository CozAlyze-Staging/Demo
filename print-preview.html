<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Print Your Chart · Preview</title>
<!-- PRINT YOUR CHART · PREVIEW PP1 (Oct 27 2026, staging only, standalone, linked from no real page).
     His request: the birth chart page at the end of each reading (Vedic, Tropical, Combined) has the readings ready
     to open, expand and print without tapping Save, and a Print Your Chart button in the middle of the bottom row
     (Save Chart · Print Your Chart · Add-ons) that opens the full reading with Expand All and Print / Save PDF at
     the top, the way a saved chart's reading opens.
       print-preview.html?sys=vedic | tropical | compare
     shows the REAL live birth chart page of that reading (unchanged file) with the two proposed additions placed
     into it for this preview: the Your Readings links (the saved page's own Saved Readings look; Vedic and Tropical)
     and the Print Your Chart pill. They open print-preview-vedic / -tropical / -compare.html, copies of the saved
     documents that read the chart on this device without saving it (print-preview.js). A reopened saved chart
     opens its own saved documents instead. Nothing here is saved, and no real page links here. -->
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#page{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
</style>
<script src="coz-saved.js?v=6"></script>
<script src="print-preview.js?v=1"></script>
</head>
<body>
<iframe id="page" title="Your birth chart"></iframe>
<script>
(function(){
  var CHART = { vedic: "vedic-birth-chart.html", tropical: "tropical-birth-chart.html", compare: "compare-birth-charts.html" };
  var DOC = { vedic: "print-preview-vedic.html", tropical: "print-preview-tropical.html", compare: "print-preview-compare.html" };
  var SAVED = { vedic: "saved-vedic-document.html", tropical: "saved-tropical-document.html", compare: "saved-compare-document.html" };
  var FIRST = { vedic: "reading", tropical: "reading", compare: "combined" };
  var q = new URLSearchParams(location.search), sys = CHART[q.get("sys")] ? q.get("sys") : "vedic";
  var frame = document.getElementById("page");

  function parse(s){ try { return JSON.parse(s); } catch (e) { return null; } }
  /* a reopened saved chart: its own saved record (by run ID, and the reading it holds) */
  function savedRecord(){
    var bd = parse(localStorage.getItem("emergeBirthData")), out = null;
    if (!bd || !bd.runId) return null;
    try {
      (JSON.parse(localStorage.getItem("cozSavedCharts") || "{}").records || []).forEach(function (r) {
        if (out || !r || r.runId !== bd.runId) return;
        if (sys === "compare" ? r.kind === "compare" : (r.kind === "chart" && r.systems && r.systems[sys])) out = r;
      });
    } catch (e) {}
    return out;
  }
  /* where a reading opens: the chart on this device unsaved, or a reopened saved chart's own saved document */
  function target(view){
    if (!CozPrintPreview.liveBirth()) { var rec = savedRecord(); if (rec) return SAVED[sys] + "?view=" + view + "&id=" + encodeURIComponent(rec.id); }
    return DOC[sys] + "?view=" + view + "&id=live";
  }
  function availability(){
    if (CozPrintPreview.liveBirth()) return CozPrintPreview.available() || {};
    var rec = savedRecord(), L = rec && rec.library && rec.library[sys] || {};
    if (sys === "vedic") return { reading: !!(L.reading && L.reading.sections), lagna: !!(L.lagna && L.lagna.sign), lifeCycle: !!(L.lifeCycle && L.lifeCycle.data) };
    return { reading: !!(L.reading && L.reading.sections), ascendant: !!(L.ascendant && L.ascendant.sign), transits: !!rec };
  }

  /* the Print Your Chart pill, between Save Chart and Add-ons, in the row's own style */
  function addPrint(d){
    var row = d.querySelector("#cozChartEnd .row") || d.querySelector(".chart-end");
    if (!row || row.querySelector("[data-pp]")) return;
    var a = d.createElement("a"); a.className = "pl"; a.setAttribute("data-pp", "print");
    a.href = target(FIRST[sys]); a.target = "_top"; a.textContent = "Print Your Chart";
    row.insertBefore(a, row.children[1] || null);
    /* three pills on one phone row: same pills and 15px labels, a little less room inside each and between them;
       if a phone is still too narrow, the row wraps rather than run off the screen */
    if ((d.defaultView || window).innerWidth < 440) {
      row.style.gap = "8px";
      Array.prototype.forEach.call(row.children, function (p) { p.style.paddingLeft = p.style.paddingRight = "12px"; });
    }
    row.style.flexWrap = "wrap";
  }
  /* the Your Readings links, built with the chart page's own helpers and Saved Readings look */
  function addReadings(w, d){
    var inner = d.querySelector(".report-inner"); if (!inner || d.getElementById("live-readings-heading")) return;
    var av = availability();
    var rows = sys === "vedic"
      ? [["Your Vedic Reading", "reading", av.reading], ["Your Ascendant – Lagna", "lagna", av.lagna], ["Your Current Life Cycle", "life-cycle", av.lifeCycle]]
      : [["Your Tropical Reading", "reading", av.reading], ["Your Ascendant", "ascendant", av.ascendant], ["Your Current Transits", "transits", av.transits]];
    var sec = w.el("section", "report-section saved-readings");
    sec.setAttribute("aria-labelledby", "live-readings-heading");
    sec.appendChild(w.sectionHeading("Quick access to other views for this chart", "Your Readings", "live-readings-heading", "", false));
    var grid = w.el("div", "saved-readings-links");
    rows.forEach(function (r) {
      var a = w.el("a", r[2] ? null : "unavailable");
      a.appendChild(w.el("span", null, r[0])); a.firstChild.style.color = "";
      if (r[2]) { a.href = target(r[1]); a.target = "_top"; a.appendChild(w.el("span", null, "›")); }
      else { a.setAttribute("aria-disabled", "true"); a.appendChild(w.el("small", null, "Not finished yet")); }
      grid.appendChild(a);
    });
    sec.appendChild(grid);
    inner.insertBefore(sec, inner.querySelector(".report-footer"));
  }

  frame.addEventListener("load", function () {
    var w = frame.contentWindow, d = null;
    try { d = frame.contentDocument; } catch (e) { return; }
    if (!d || !d.body) return;
    var here = (w.location.pathname.split("/").pop() || "");
    if (here !== CHART[sys] || /[?&]saved=1\b/.test(w.location.search)) return;          /* only the live chart page */
    if (!d.querySelector("base")) { var b = d.createElement("base"); b.target = "_top"; d.head.appendChild(b); }   /* its links leave the preview */
    addPrint(d);
    if (sys !== "compare" && typeof w.el === "function" && typeof w.sectionHeading === "function") addReadings(w, d);
  });
  frame.src = CHART[sys];
})();
</script>
</body>
</html>
