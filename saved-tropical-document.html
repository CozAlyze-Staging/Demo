<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saved Reading · CozAlyze</title>
<!--
  COZALYZE · SAVED TROPICAL DOCUMENT · TD1.4 (Oct 14 2026)
  PL1 (Oct 27 2026, Print Your Chart, staging only): ?view=...&id=live opens the Tropical chart now on this device
  without saving it, from the birth chart page's Print Your Chart and Your Readings. print-live-tropical.js builds
  that unsaved record in memory (nothing is written to Saved Charts). Only the wording for an unsaved chart, the
  links and the Back button differ. A saved record opens exactly as before.
  TD1.4 (Jason): every view ends with the Your Saved Chart links, like the saved Vedic document
  (saved-vedic-document.html SVD1.1): Your Birth Chart, Your Tropical Reading, Your Ascendant,
  Your Current Transits. The page being read shows unlinked. The links are hidden in print.
  TD1.3 (Jason): from Compare the Back button reads "Back to Your Tropical Birth Chart", matching the
  Compare page title (CSY1.5+). From Saved, unchanged.
  TD1.2: opened from Compare (from=compare), Back returns to that Compare page
  (compare-system.html?sys=tropical#reading). Saved Library behavior unchanged.
  One renderer for the Tropical saved-document views:
    saved-tropical-document.html?view=reading&id=<record>     Your Tropical Reading (six sections)
    saved-tropical-document.html?view=ascendant&id=<record>   Your Ascendant (Rising Sign)
    saved-tropical-document.html?view=transits&id=<record>    Your Current Transits (TD1.1: recalculated
                                                              from the record's own Tropical chart each time
                                                              the page opens; never stored)
  Data: the selected cozSavedCharts record's library (rec.library.tropical), captured at save
  time by saved-tropical-library.js. Document renderer only: no animation, no model request,
  no regeneration. Shares saved-document.css with the Vedic documents; loads no Vedic module.
  Print / Save PDF opens at top level when framed and expands every section.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="saved-document.css?v=3">
<style>
/* TD1.4: the chaining links, same rules as the saved Vedic document (saved-vedic-document.html SVD1.1) */
.doc-links p{margin:0 0 .5rem}
.doc-links a{color:var(--coz-gold); text-decoration:none}
.doc-links .here{color:var(--coz-ink-soft)}
@media print{ .doc-links{display:none} }

/* v20.6 (Jason, Oct 15): the Home / Saved / Account bar stays on screen the whole time, so a saved
   reading can always be left. Same bar as the Vedic birth chart (v20.1 shared reading footer). */
#cozFoot{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  padding-bottom:env(safe-area-inset-bottom);
  background:rgb(8 11 17 / .86);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgb(201 161 94 / .18);
}
#cozFoot .coz-foot-tag{
  text-align:center; font-style:italic; font-size:13px; letter-spacing:.04em;
  color:#8b8272; padding:11px 20px 3px;
}
#cozFoot .coz-foot-links{display:flex; height:64px}
#cozFoot a{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; text-decoration:none; color:#8b8272; font-size:10.5px; letter-spacing:.06em;
  -webkit-tap-highlight-color:transparent;
}
#cozFoot a svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round}
#cozFoot a:active{color:var(--coz-gold,#b88a55)}
@media print{ #cozFoot{display:none !important} }
.doc-shell{padding-bottom:calc(env(safe-area-inset-bottom) + 124px)}   /* the bar owns the bottom of the screen */
</style>
<script src="coz-saved.js?v=4"></script>
<script src="saved-tropical-library.js?v=2"></script>
<script src="print-live-tropical.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<script src="compare-current-timing.js?v=5"></script>
<style id="coz-rd1">/* RD1 (Oct 22 2026): every tappable label at least 15px on a phone */html body #cozFoot a{font-size:15px}html body .doc-button{font-size:max(15px,0.88rem)}/* RD3: Vedic/Tropical/Life Cycle Back/Next and the bottom bar labels larger */html body #cozFoot a{font-size:17px}</style>
<style id="coz-dv1">/* DV1 (Oct 22 2026): version stamps and the diagnostic launcher show only on a device with developer view on (localStorage cozDevView = "1") */html:not(.coz-dev) .stamp,html:not(.coz-dev) .stamp2,html:not(.coz-dev) .vedic-stamp,html:not(.coz-dev) .build-stamp,html:not(.coz-dev) .lc-stamp,html:not(.coz-dev) .cs-stamp,html:not(.coz-dev) .ktw-stamp,html:not(.coz-dev) .wcn-stamp,html:not(.coz-dev) #stamp,html:not(.coz-dev) #cozDiagLaunch{display:none!important}</style><script>try{if(localStorage.getItem("cozDevView")==="1")document.documentElement.classList.add("coz-dev")}catch(e){}</script>
</head>
<body>
<div class="doc-shell">
  <div class="doc-toolbar">
    <a class="doc-button" id="backBtn" href="saved-charts.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      Back to Birth Chart
    </a>
    <div class="doc-actions">
    <button type="button" class="doc-button" id="expandBtn">Expand All</button>
    <button type="button" class="doc-button" id="printBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M7 8V3h10v5M7 17H4a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-3M7 14h10v7H7z"/></svg>
      Print / Save PDF
    </button>
    </div>
  </div>
  <div id="mount"></div>
  <p class="doc-savednote" id="savedNote"></p>
</div>
<script>
"use strict";
(function(){
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var DISCLOSURE = "This AI-generated astrological content is provided for reflection and entertainment only. It is not scientific, medical, legal, financial, or professional advice.";
  var TITLES = { "reading": "Your Tropical Reading", "ascendant": "Your Ascendant", "transits": "Your Current Transits" };
  var LIVE = new URLSearchParams(location.search).get("id") === "live";   /* PL1: the chart on this device, not saved (print-live-tropical.js) */

  function el(tag,cls,text){ var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function paras(host, list){ (list || []).forEach(function(t){ t = t == null ? "" : String(t); if (!t.trim()) return; host.appendChild(t.indexOf("## ") === 0 ? el("h3",null,t.slice(3)) : el("p",null,t)); }); return host; }
  function pad2(n){ n = Math.round(Number(n) || 0); return (n<10?"0":"")+n; }
  function longDate(iso){ if (!iso) return ""; var d = new Date(iso); if (isNaN(d)) return String(iso); return MONTHS[d.getUTCMonth()] + " " + d.getUTCDate() + ", " + d.getUTCFullYear(); }
  function section(number, title, open){
    var d = el("details","doc-section"); if (open) d.open = true;
    var sm = el("summary"); var h2 = el("h2");
    if (number != null){ h2.appendChild(el("span","num",number + ".")); }
    h2.appendChild(document.createTextNode(title));
    sm.appendChild(h2); sm.appendChild(el("span","chev","\u203A")); d.appendChild(sm);
    return d;
  }
  function empty(msg, heading){
    var c = el("div","doc-empty");
    c.appendChild(el("h2",null,heading || (LIVE ? "This reading isn\u2019t ready to print" : "This saved reading could not be opened")));
    var p = el("p",null,msg + " "); var a = el("a",null,LIVE ? "Back to Birth Chart" : "Open Saved Charts"); a.href = LIVE ? "tropical-birth-chart.html" : "saved-charts.html"; p.appendChild(a); c.appendChild(p);
    return c;
  }
  function cozPrint(){
    var framed = false; try { framed = window.top !== window; } catch (e) { framed = true; }
    if (framed) { var u = new URL(location.href); u.searchParams.set("print", "1"); window.open(u.href, "_blank"); return; }
    window.print();
  }
  function cozAutoPrint(){
    if (!/[?&]print=1\b/.test(location.search)) return;
    var go = function(){ setTimeout(function(){ window.print(); }, 250); };
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go();
  }

  var qp = new URLSearchParams(location.search);
  var view = qp.get("view") || "reading";
  var mount = document.getElementById("mount");
  document.getElementById("printBtn").addEventListener("click", cozPrint);
  document.getElementById("expandBtn").addEventListener("click", function(){
    var all = document.querySelectorAll("details.doc-section"), open = Array.prototype.every.call(all, function(d){ return d.open; });
    all.forEach(function(d){ d.open = !open; });
    this.textContent = open ? "Expand All" : "Collapse All";
  });
  window.addEventListener("beforeprint", function(){ document.querySelectorAll("details.doc-section").forEach(function(d){ d.dataset.wasOpen = d.open ? "1" : "0"; d.open = true; }); });
  window.addEventListener("afterprint", function(){ document.querySelectorAll("details.doc-section").forEach(function(d){ if (d.dataset.wasOpen === "0") d.open = false; }); });

  if (LIVE) document.getElementById("backBtn").href = "tropical-birth-chart.html";              /* PL1 */
  var lib = window.CozSavedTropical ? window.CozSavedTropical.load() : null;
  if (!lib){ mount.appendChild(empty(LIVE ? "There\u2019s no chart on this device to print yet." : "It may have been removed from this device.")); return; }
  if (!LIVE) document.getElementById("backBtn").href = "tropical-birth-chart.html?saved=1&id=" + encodeURIComponent(lib.id);
  if (qp.get("from") === "compare") {                                  /* opened from Compare: go back there */
    var bb = document.getElementById("backBtn");
    bb.href = "compare-system.html?sys=tropical#reading";
    bb.lastChild.textContent = " Back to Your Tropical Birth Chart";
  }
  document.title = (TITLES[view] || "Saved Reading") + " \u00B7 CozAlyze";

  var paper = el("article","doc-paper"), inner = el("div","doc-inner");
  paper.appendChild(inner);
  inner.appendChild(el("p","doc-kicker", TITLES[view] || "Saved Reading"));
  inner.appendChild(el("h1",null, lib.name || "Your Chart"));
  /* PG2 (Oct 27 2026): the Tropical record keeps the birth date as entered ("1922-09-09") and the time with a leading zero
     ("03:25 AM"), so the printed line read differently from the Vedic document's. It now reads the same way
     ("September 9, 1922 \u2022 3:25 AM"). A value in any other form is shown as stored. */
  function niceDate(s){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || "")); return m && +m[2] >= 1 && +m[2] <= 12 ? MONTHS[+m[2] - 1] + " " + (+m[3]) + ", " + m[1] : s; }
  function niceTime(s){ return String(s || "").replace(/^0(\d:\d{2}\s*[AP]M)$/i, "$1"); }
  var b = lib.birth || {}, bits = [niceDate(b.date), niceTime(b.time), b.location].filter(Boolean);
  if (bits.length) inner.appendChild(el("p","doc-birthline", bits.join("  \u2022  ")));

  var L = lib.library || {}, ok = true;

  if (view === "reading"){
    var R = L.reading;
    if (!R || !R.sections){ ok = false; mount.appendChild(empty(LIVE ? "Your Tropical Reading isn\u2019t finished yet. Open it from your dashboard first." : "The Tropical Reading hadn't finished when this chart was saved.")); }
    else (R.order || []).forEach(function(s, i){
      var d = section(s.number, s.title, i === 0);
      d.appendChild(paras(el("div","doc-copy"), R.sections[s.id]));
      inner.appendChild(d);
    });
  }
  else if (view === "ascendant"){
    var A = L.ascendant;
    if (!A || !A.sign){ ok = false; mount.appendChild(empty(LIVE ? "Your Ascendant reading isn\u2019t ready yet. Open it from your dashboard first." : "The Ascendant reading wasn't saved with this chart.")); }
    else {
      var head = el("div");
      head.appendChild(el("p","doc-label","Tropical Ascendant"));
      head.appendChild(el("p","doc-big", A.sign + (A.degree != null ? " " + pad2(A.degree) + "\u00B0" + pad2(A.minute) + "\u2032" : "")));
      inner.appendChild(head);
      var s1 = section(null,"Tropical Perspective",true); s1.appendChild(paras(el("div","doc-copy"), A.shared)); inner.appendChild(s1);
      var s2 = section(null,"How You Meet the World",false); s2.appendChild(paras(el("div","doc-copy"), A.meet && A.meet.length ? [A.meet[0]] : [])); inner.appendChild(s2);
      if (A.ruler && A.ruler.length){ var s3 = section(null,"Your Chart Ruler",false); s3.appendChild(paras(el("div","doc-copy"), A.ruler)); inner.appendChild(s3); }
      var noticeList = (A.notice && A.notice.length) ? A.notice : ((A.meet && A.meet[1]) ? [A.meet[1], "These themes describe possible patterns, not fixed outcomes."] : []);
      if (noticeList.length){ var s4 = section(null,"What to Notice",false); s4.appendChild(paras(el("div","doc-copy"), noticeList)); inner.appendChild(s4); }
    }
  }
  else if (view === "transits"){
    var TM = window.COZ_TIMING;
    if (!lib.chart || !TM || !TM.loadTropicalChart){ ok = false; mount.appendChild(empty(LIVE ? "There\u2019s no Tropical chart on this device to print yet." : "The Tropical chart wasn't saved with this record.")); }
    else {
      mount.appendChild(paper);
      var wait = el("p","doc-copy","Calculating your current transits\u2026"); inner.appendChild(wait);
      TM.loadTropicalChart(lib.chart).then(function(d){
        inner.removeChild(wait);
        if (!d.ok){ inner.appendChild(el("p","doc-copy", TM.FAIL_TROPICAL)); links(inner); return; }
        var now = d.now;
        inner.appendChild(el("p","doc-label","As of " + now.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}) + ", " + now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})));
        var sum = el("div","doc-copy"); (d.text.summary || []).forEach(function(p){ sum.appendChild(el("p",null,p)); }); inner.appendChild(sum);
        (d.text.sections || []).forEach(function(s, i){
          var sec = section(null, s.title, i === 0), body = el("div","doc-copy");
          (s.blocks || []).forEach(function(b){
            if (b.type === "h3") body.appendChild(el("h3",null,b.text));
            else if (b.type === "meta") body.appendChild(el("p","doc-when",b.text));
            else body.appendChild(el("p",null,b.text));
          });
          sec.appendChild(body); inner.appendChild(sec);
        });
        var m = section(null,"How This Was Calculated",false), mb = el("div","doc-copy"), t = d.tropical, P = d.policy, st = t.settings || {}, cl = t.client || {};
        function stamp(x){ return new Date(x).toLocaleString("en-US",{dateStyle:"medium",timeStyle:"short"}); }
        var shown = d.fast.concat(d.slow ? [d.slow] : []);
        [["Zodiac", st.zodiac || "Tropical"],
         ["Calculated", stamp(now) + (LIVE ? ". Transits are recalculated each time this page opens." : ". Transits are recalculated each time this page opens; they are not part of the saved record.")],
         ["Natal chart", [cl.birthDate, cl.birthTime, cl.locationLabel].filter(Boolean).join(", ")],
         ["Transiting planets", P.fastPlanets.join(", ") + " (faster); " + P.slowPlanets.join(", ") + " (slower)" + (P.moonIncluded ? "; the Moon" : ". The Moon is not included.")],
         ["Natal points", P.natalTargets.join(", ") + ". The nodes are " + (st.nodeType || P.nodeType) + " nodes."],
         ["Aspects and orbs", P.aspects.map(function(a){ return a.type.charAt(0).toUpperCase() + a.type.slice(1) + " " + a.angle + "\u00B0, orb " + a.orb + "\u00B0"; }).join("; ")],
         ["Active transits", shown.length ? shown.map(function(h){ return h.planet + " " + h.aspect + " natal " + h.target + ", orb " + h.orb.toFixed(2) + "\u00B0, " + h.status; }).join("; ") : "None within the current orbs"],
         ["Interpretation", "The calculations and selection rules are the same ones used for Compare Current Timing. The interpretive wording is a development draft awaiting review by a Western astrologer. It has not been professionally reviewed."]
        ].forEach(function(r){ if (!r[1]) return; var p = el("p"); var b = el("strong",null,r[0] + ". "); p.appendChild(b); p.appendChild(document.createTextNode(r[1])); mb.appendChild(p); });
        m.appendChild(mb); inner.appendChild(m);
        inner.appendChild(el("p","doc-when","These are themes that may be present, not predictions of what will happen."));
        finish(true);
      });
      return;
    }
  }
  else { ok = false; mount.appendChild(empty("Unknown view.")); }

  /* TD1.4: chaining links at the end of every saved Tropical page, like the saved Vedic document */
  function links(host){
    var box = el("div","doc-links"), from = qp.get("from") === "compare" ? "&from=compare" : "";
    box.appendChild(el("p","doc-label",LIVE ? "Your Readings" : "Your Saved Chart"));
    [["chart","Your Birth Chart"],["reading","Your Tropical Reading"],["ascendant","Your Ascendant"],["transits","Your Current Transits"]].forEach(function(v){
      var p = el("p");
      if (v[0] === view) p.appendChild(el("span","here",v[1]));
      else {
        var a = el("a",null,v[1] + " \u203A");
        a.href = v[0] === "chart" ? (LIVE ? "tropical-birth-chart.html" : "tropical-birth-chart.html?saved=1&id=" + encodeURIComponent(lib.id))
                                  : "saved-tropical-document.html?view=" + v[0] + "&id=" + encodeURIComponent(lib.id) + from;
        p.appendChild(a);
      }
      box.appendChild(p);
    });
    host.appendChild(box);
  }
  function finish(live){
    links(inner);
    var foot = el("footer","doc-footer");
    foot.appendChild(el("p",null,DISCLOSURE));
    if (lib.chart && lib.chart.documentId) foot.appendChild(el("p",null,"Generated by CozAlyze \u00B7 " + lib.chart.documentId));
    inner.appendChild(foot);
    if (!paper.parentNode) mount.appendChild(paper);
    var savedAt = lib.rec.updatedAt || lib.rec.savedAt;
    document.getElementById("savedNote").textContent = LIVE                       /* PL1: the chart on this device, not saved */
      ? (live ? "Calculated for the chart on this device when this page opened. To keep it, use Save Chart." : "From the chart on this device. To keep it, use Save Chart.")
      : live
      ? "Calculated for this saved chart at the moment this page opened. No animation. No rewrite."
      : "These are your saved results. No animation. No rewrite." + (savedAt ? " \u00B7 Saved " + longDate(savedAt) : "");
    cozAutoPrint();
  }
  if (!ok) { links(mount); return; }
  finish(false);
})();
</script>
<div id="cozFoot">
  <div class="coz-foot-tag">CozAlyze helps you see it all</div>
  <div class="coz-foot-links">
    <a href="tropical-reading.html#/dashboard"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9h13v-9"/></svg>Home</a>
    <a href="saved-charts.html" aria-label="Saved Charts"><svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-4-5 4z"/></svg>Saved</a>
    <a href="#" data-foot="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c1.2-3.4 3.9-5 7-5s5.8 1.6 7 5"/></svg>Account</a>
  </div>
</div>
<script>
/* v20.6: Account mirrors the other Demo pages (decorative until the Account page comes into the Demo) */
document.querySelectorAll('#cozFoot a[data-foot="account"]').forEach(function(a){ a.addEventListener("click", function(ev){ ev.preventDefault();
  try { window.dispatchEvent(new CustomEvent("COZ_DASH_ACCOUNT")); } catch (e) {} }); });
</script>
