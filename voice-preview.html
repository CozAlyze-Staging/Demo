<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000f26">
<title>Voice Preview · CozAlyze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* Reading page styles, copied unchanged from vedic-reading.html */
:root {
  --vedic-navy: #000f26;
  --vedic-gold: #d4a178;
  --vedic-gold-muted: rgba(212, 161, 120, 0.65);
  --vedic-ivory: #e5d4c5;
  --vedic-ivory-muted: rgba(229, 212, 197, 0.88);
  --display-font: "Cormorant Garamond", Georgia, serif;
  --body-font: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --side-pad: 28px;
  --dash-zoom: 1;            /* opens showing the whole art, then eases to --dash-zoom-in */
  --dash-zoom-in: 1.3;
}
@media (max-width: 374px) { :root { --side-pad: 20px; } }

* { box-sizing: border-box; }
html { background: var(--vedic-navy); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--vedic-navy);
  color: var(--vedic-ivory);
  font-family: var(--body-font);
  -webkit-font-smoothing: antialiased;
}

/* Fixed background layer: iOS ignores background-attachment on body,
   so the image lives on its own fixed layer behind the scrolling content. */
.vedic-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-color: var(--vedic-navy);
  background-image: url("vedic-moon-bg.png");
  background-size: cover;
  background-position: top center;
  background-repeat: no-repeat;
  pointer-events: none;
}

.vedic-reading-page {
  position: relative;
  z-index: 1;
  min-height: 100svh;
  padding:
    calc(env(safe-area-inset-top) + 24px)
    var(--side-pad)
    calc(env(safe-area-inset-bottom) + 24px);
}

.vedic-reading-content {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  animation: vedicFadeIn 240ms ease-out;
}
@keyframes vedicFadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .vedic-reading-content { animation: none; }
  .stage { transition: none; }
}

/* ---------- header ---------- */
.vedic-back-button {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 10px);
  left: calc(var(--side-pad) - 10px);
  width: 44px;
  height: 44px;
  padding: 0;
  margin: 0;
  border: 0;
  background: transparent;
  color: var(--vedic-gold);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.vedic-back-button svg { width: 30px; height: 20px; display: block; }
.vedic-back-button:focus-visible { outline: 1px solid var(--vedic-gold-muted); outline-offset: 4px; border-radius: 4px; }

.vedic-header {
  text-align: center;
  padding-top: 6px;
}
/* His logo lockup (emblem + CozAlyze wordmark) as one image, white keyed out.
   Width is set so the wordmark reads at the spec's 28–30px display size. */
.vedic-logo {
  display: block;
  width: 140px;
  height: auto;
  margin: 0 auto;
}
.vedic-eyebrow {
  font-family: var(--body-font);
  font-size: clamp(13px, 3.5vw, 14.5px);
  font-weight: 500;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--vedic-ivory-muted);
  margin: 12px 0 0;
  padding-left: 0.28em; /* optical centre with the trailing tracking */
}
.vedic-counter {
  font-family: var(--display-font);
  font-size: clamp(27px, 7.2vw, 31px);
  font-weight: 500;
  letter-spacing: 0.06em;
  font-variant-numeric: lining-nums;
  color: var(--vedic-gold);
  margin: 40px 0 0;
}

/* ---------- ornamental divider ---------- */
.vedic-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: min(100%, 420px);
  margin: 14px auto;
  color: var(--vedic-gold);
}
.vedic-divider::before,
.vedic-divider::after {
  content: "";
  flex: 1 1 auto;
  height: 1px;
  background: var(--vedic-gold-muted);
}
.vedic-divider svg { width: 16px; height: 16px; flex: 0 0 auto; display: block; }

/* ---------- title ---------- */
.vedic-title {
  font-family: var(--display-font);
  font-size: clamp(2.6rem, 11.5vw, 3.4rem);
  font-weight: 500;
  line-height: 0.98;
  color: var(--vedic-gold);
  text-align: center;
  text-wrap: balance;
  margin: 10px 0;
}
.vedic-title--long {
  font-size: clamp(2.35rem, 10vw, 2.9rem);
}

/* ---------- body ---------- */
.vedic-body {
  font-family: var(--body-font);
  font-size: clamp(1.25rem, 5.4vw, 1.4rem);
  line-height: 1.55;
  font-weight: 400;
  color: var(--vedic-ivory);
  margin-top: 24px;
}
.vedic-body p { margin: 0 0 1.35em; }
.vedic-body p:last-child { margin-bottom: 0; }
.vedic-subhead {
  font-family: var(--display-font);
  font-size: clamp(1.6rem, 6.4vw, 1.9rem);
  font-weight: 500;
  line-height: 1.12;
  color: var(--vedic-gold);
  text-align: left;
  margin: 1.6em 0 0.7em;
}
.vedic-body .vedic-subhead:first-child { margin-top: 0; }

/* ---------- bottom navigation ---------- */
.vedic-nav { margin-top: 34px; }
.vedic-nav-rule {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--vedic-gold);
}
.vedic-nav-rule::before,
.vedic-nav-rule::after {
  content: "";
  flex: 1 1 auto;
  height: 1px;
  background: var(--vedic-gold-muted);
}
.vedic-nav-rule svg { width: 14px; height: 14px; flex: 0 0 auto; display: block; }
.vedic-nav-links {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding-top: 6px;
}
.vedic-nav a,
.vedic-nav button {
  font-family: var(--body-font);
  font-size: clamp(16px, 4.3vw, 18px);
  font-weight: 400;
  color: var(--vedic-gold);
  text-decoration: none;
  background: transparent;
  border: 0;
  padding: 0;
  margin: 0;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  text-align: left;
}
.vedic-nav a:focus-visible,
.vedic-nav button:focus-visible { outline: 1px solid var(--vedic-gold-muted); outline-offset: 4px; border-radius: 4px; }
.vedic-nav .vedic-nav-next { text-align: right; justify-content: flex-end; }
.vedic-nav svg:not(.vedic-nav-rule svg) { width: 24px; height: 15px; flex: 0 0 auto; }

</style>
<style>
/* VP1 preview only: the reading read aloud in the chosen voice. The two avatar pictures appear only at the top of
   the first page of the reading; every other page has buttons there instead. Everything else on this page is the
   reading page's own styles, unchanged. */
.avatar-choice { margin: 22px 0 4px; text-align: center; }
.avatar-choice-title {
  font-family: var(--display-font);
  font-size: clamp(1.6rem, 6.4vw, 1.9rem);
  font-weight: 500;
  line-height: 1.12;
  color: var(--vedic-gold);
  margin: 0 0 14px;
}
.avatar-options { display: flex; justify-content: center; gap: 18px; }
.avatar-option {
  flex: 0 1 40%;
  max-width: 220px;
  padding: 0;
  margin: 0;
  border: 0;
  background: transparent;
  color: var(--vedic-gold);
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.avatar-option img {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid var(--vedic-gold-muted);
}
.avatar-speaking { margin: 22px 0 0; }
.avatar-speaking img {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid var(--vedic-gold-muted);
}
.avatar-controls { margin-top: 10px; }
.avatar-controls .vedic-nav-links span {
  font-family: var(--body-font);
  font-size: clamp(16px, 4.3vw, 18px);
  color: var(--vedic-ivory-muted);
}
/* every other page: the same gold title; one voice already chosen = the title itself is the button,
   otherwise the two voices sit either side of the reading's star */
.voice-bar { margin: 22px 0 4px; text-align: center; }
.voice-bar .avatar-choice-title { margin-bottom: 6px; }
.voice-cta {
  font-family: var(--display-font);
  font-size: clamp(1.6rem, 6.4vw, 1.9rem);
  font-weight: 500;
  line-height: 1.12;
  color: var(--vedic-gold);
  background: transparent;
  border: 0;
  padding: 0;
  margin: 0;
  min-height: 44px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.voice-pair { display: flex; justify-content: center; align-items: center; gap: 18px; color: var(--vedic-gold); }
.voice-pair svg { width: 14px; height: 14px; flex: 0 0 auto; display: block; }
.voice-pair button {
  font-family: var(--body-font);
  font-size: clamp(16px, 4.3vw, 18px);
  font-weight: 400;
  color: var(--vedic-gold);
  background: transparent;
  border: 0;
  padding: 0;
  margin: 0;
  min-height: 44px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.voice-cta:focus-visible,
.voice-pair button:focus-visible { outline: 1px solid var(--vedic-gold-muted); outline-offset: 4px; border-radius: 4px; }
</style>
</head>
<body data-view="reading">
<div class="vedic-bg" aria-hidden="true"></div>
<main class="vedic-reading-page">
  <button class="vedic-back-button" type="button" aria-label="Back to your reading dashboard">
    <svg viewBox="0 0 30 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M29 10H2M9 3 2 10l7 7"/>
    </svg>
  </button>
  <div class="vedic-reading-content" id="content"></div>
</main>
<script>
(function () {
  /* VP1 (Oct 27, staging preview only): no moving avatar for now, the chosen voice reads the page.
     First page of the reading: "Have Your Chart Read By" with the two avatar pictures; tapping one reads the page in
     that voice and remembers the choice. Following pages of the reading: one "Have This Page Read" button in the
     remembered voice. Pages of their own (Your Ascendant, Your Current Life Cycle, Your Current Transits): the two
     voices as buttons. Every page here reads the same four sample paragraphs, the only text the voice server reads.
     VP2: on the first page the voice opens with a spoken welcome that says the reader's name (preview: Jason),
     then reads the page. The welcome is heard, not shown. */
  var VOICE_SERVER = "https://cozalyze-voice-server.netlify.app";
  var ART = "?v=3";

  var q = new URLSearchParams(location.search);
  var sys = q.get("sys") === "tropical" ? "tropical" : "vedic";
  var page = ["1", "2", "asc", "cycle"].indexOf(q.get("page")) >= 0 ? q.get("page") : "1";

  var SYS = {
    vedic:    { eyebrow: "Your Vedic Reading",    t1: "Your Essential Nature & Guiding Planet", t2: "Your Mind, Intuition & Spiritual Patterning",
                back: "Back to Your Vedic Reading",    cycle: "Your Current Life Cycle" },
    tropical: { eyebrow: "Your Tropical Reading", t1: "At Your Core",                           t2: "Love, Desire & Creativity",
                back: "Back to Your Tropical Reading", cycle: "Your Current Transits" }
  }[sys];
  var VIEW = {
    "1":     { counter: "01 OF 06", title: SYS.t1,           label: "Section 01 of 06" },
    "2":     { counter: "02 OF 06", title: SYS.t2,           label: "Section 02 of 06" },
    "asc":   { counter: "",         title: "Your Ascendant", label: "Your Ascendant" },
    "cycle": { counter: "",         title: SYS.cycle,        label: SYS.cycle }
  }[page];

  var STAR = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0 13.6 10.4 24 12 13.6 13.6 12 24 10.4 13.6 0 12 10.4 10.4Z"/></svg>';
  var ARROW_L = '<svg viewBox="0 0 22 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 7H2M7 2 2 7l5 5"/></svg>';
  var ARROW_R = '<svg viewBox="0 0 22 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 7h19M15 2l5 5-5 5"/></svg>';

  var SAMPLE = [
    "Sample text for this preview. The reading's own paragraphs sit here exactly as they do now, and nothing about them changes.",
    "Once an avatar is chosen, it reads this section aloud from the first line to the last, then turns to the next section and keeps going.",
    "The text stays on the page the whole time, so the reader can follow along, scroll ahead, or simply listen.",
    "All six sections are read once, in order, finishing with the last section of the reading."
  ];

  /* the voice chosen on the first page, kept for the pages after it */
  var KEY = "cozVoicePick-" + sys;
  function remembered() { try { var v = localStorage.getItem(KEY); return v === "male" || v === "female" ? v : null; } catch (e) { return null; } }
  function remember(w) { try { localStorage.setItem(KEY, w); } catch (e) {} }

  var reading = false;               /* the voice is reading this page (controls showing) */
  var who = remembered() || "female";

  /* one audio element for the whole page; the first tap starts it, which iPhone requires */
  var player = new Audio();
  player.preload = "auto";
  player.setAttribute("playsinline", "");
  /* what the voice says on this page, in order: the welcome first on the first page only */
  var SEQ = page === "1" ? ["intro", 1, 2, 3, 4] : [1, 2, 3, 4];
  var step = -1;

  function partUrl(n) { return VOICE_SERVER + "/api/sample-audio?avatar=" + sys + "-" + who + "&part=" + n; }
  function label(t) { var b = document.getElementById("vpPause"); if (b) b.textContent = t; }
  function playStep(i) {
    step = i;
    player.src = partUrl(SEQ[i]);
    label("Pause");
    var p = player.play();
    if (p && p.catch) p.catch(function () { label("Try again"); });
  }
  player.addEventListener("ended", function () {
    if (step < SEQ.length - 1) playStep(step + 1);
    else { step = -1; label("Play again"); }
  });
  player.addEventListener("error", function () { if (reading && step >= 0) label("Try again"); });

  function controlsHtml(rule) {   /* the star rule only under the picture; elsewhere the title's divider is right above */
    return '<nav class="vedic-nav avatar-controls" aria-label="Reading aloud">' +
        (rule ? '<div class="vedic-nav-rule" aria-hidden="true">' + STAR + '</div>' : '') +
        '<div class="vedic-nav-links">' +
          '<button type="button" id="vpPause">Pause</button>' +
          '<span>' + VIEW.label + '</span>' +
          '<button type="button" id="vpStop">Stop</button>' +
        '</div>' +
      '</nav>';
  }

  function voiceHtml() {
    if (page === "1") {
      if (!reading) {
        return '<section class="avatar-choice" aria-label="Have your chart read">' +
            '<h2 class="avatar-choice-title">Have Your Chart Read By</h2>' +
            '<div class="avatar-options">' +
              '<button type="button" class="avatar-option vp-voice" data-who="male" aria-label="Read by this voice"><img src="avatars/avatar-' + sys + '-male.jpg' + ART + '" alt="" width="1024" height="1536"></button>' +
              '<button type="button" class="avatar-option vp-voice" data-who="female" aria-label="Read by this voice"><img src="avatars/avatar-' + sys + '-female.jpg' + ART + '" alt="" width="1024" height="1536"></button>' +
            '</div>' +
          '</section>';
      }
      return '<section class="avatar-speaking" aria-label="Your chart is being read">' +
          '<img src="avatars/avatar-' + sys + '-' + who + '.jpg' + ART + '" alt="" width="1024" height="1536">' +
          controlsHtml(true) +
        '</section>';
    }
    if (reading) return '<section class="voice-bar" aria-label="This page is being read">' + controlsHtml(false) + '</section>';
    if (page === "2" && remembered()) {
      return '<section class="voice-bar" aria-label="Have this page read">' +
          '<button type="button" class="vp-voice voice-cta" data-who="' + remembered() + '">Have This Page Read</button>' +
        '</section>';
    }
    return '<section class="voice-bar" aria-label="Have this page read">' +
        '<h2 class="avatar-choice-title">Have This Page Read By</h2>' +
        '<div class="voice-pair">' +
          '<button type="button" class="vp-voice" data-who="male">Male Voice</button>' +
          STAR +
          '<button type="button" class="vp-voice" data-who="female">Female Voice</button>' +
        '</div>' +
      '</section>';
  }

  function go(p) { return "?sys=" + sys + "&page=" + p; }
  function navHtml() {
    var left, right = "";
    if (page === "1") { left = '<a href="' + go("1") + '">' + ARROW_L + ' Back to Your Reading</a>'; right = '<a class="vedic-nav-next" href="' + go("2") + '">Next: ' + SYS.t2 + ' ' + ARROW_R + '</a>'; }
    else if (page === "2") { left = '<a href="' + go("1") + '">' + ARROW_L + ' Back to Your Reading</a>'; right = '<a class="vedic-nav-next" href="' + go("asc") + '">Next: Your Ascendant ' + ARROW_R + '</a>'; }
    else if (page === "asc") { left = '<a href="' + go("1") + '">' + ARROW_L + ' ' + SYS.back + '</a>'; right = '<a class="vedic-nav-next" href="' + go("cycle") + '">Next: ' + SYS.cycle + ' ' + ARROW_R + '</a>'; }
    else { left = '<a href="' + go("1") + '">' + ARROW_L + ' ' + SYS.back + '</a>'; }
    return '<nav class="vedic-nav" aria-label="Reading navigation">' +
        '<div class="vedic-nav-rule" aria-hidden="true">' + STAR + '</div>' +
        '<div class="vedic-nav-links">' + left + right + '</div>' +
      '</nav>';
  }

  function render() {
    document.getElementById("content").innerHTML =
      '<header class="vedic-header">' +
        '<img class="vedic-logo" src="vedic-logo.png" alt="CozAlyze" width="1000" height="1055">' +
        '<p class="vedic-eyebrow">' + SYS.eyebrow + '</p>' +
        (VIEW.counter ? '<p class="vedic-counter">' + VIEW.counter + '</p>' : '') +
      '</header>' +
      '<div class="vedic-divider" aria-hidden="true">' + STAR + '</div>' +
      '<h1 class="' + (VIEW.title.length > 22 ? "vedic-title vedic-title--long" : "vedic-title") + '">' + VIEW.title + '</h1>' +
      '<div class="vedic-divider" aria-hidden="true">' + STAR + '</div>' +
      voiceHtml() +
      '<section class="vedic-body">' + SAMPLE.map(function (p) { return "<p>" + p + "</p>"; }).join("") + '</section>' +
      navHtml();

    Array.prototype.forEach.call(document.querySelectorAll(".vp-voice"), function (b) {
      b.addEventListener("click", function () {
        who = b.getAttribute("data-who") === "male" ? "male" : "female";
        if (page === "1") remember(who);
        reading = true;
        render();
        playStep(0);                       /* inside the tap, so iPhone allows the sound */
      });
    });

    var pause = document.getElementById("vpPause");
    if (pause) pause.addEventListener("click", function () {
      var t = pause.textContent;
      if (t === "Pause") { player.pause(); label("Resume"); }
      else if (t === "Resume") { var p = player.play(); label("Pause"); if (p && p.catch) p.catch(function () { label("Try again"); }); }
      else playStep(t === "Try again" && step >= 0 ? step : 0);   /* Play again, Try again */
    });

    var stop = document.getElementById("vpStop");
    if (stop) stop.addEventListener("click", function () {
      player.pause();
      step = -1;
      reading = false;
      render();
    });
  }

  render();
})();
</script>
</body>
</html>
