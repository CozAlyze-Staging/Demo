<style>
/* Reading page styles, copied unchanged from vedic-reading.html */
:root {
  --vedic-navy: #000f26;
  --vedic-gold: #d4a178;
  --vedic-gold-muted: rgba(212, 161, 120, 0.65);
  --vedic-ivory: #e5d4c5;
  --vedic-ivory-muted: rgba(229, 212, 197, 0.88);
  --display-font: "Cormorant Garamond", Georgia, serif;
  --body-font: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --side-pad: 28px;
  --dash-zoom: 1;            /* opens showing the whole art, then eases to --dash-zoom-in */
  --dash-zoom-in: 1.3;
}
@media (max-width: 374px) { :root { --side-pad: 20px; } }

* { box-sizing: border-box; }
html { background: var(--vedic-navy); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--vedic-navy);
  color: var(--vedic-ivory);
  font-family: var(--body-font);
  -webkit-font-smoothing: antialiased;
}

/* Fixed background layer: iOS ignores background-attachment on body,
   so the image lives on its own fixed layer behind the scrolling content. */
.vedic-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-color: var(--vedic-navy);
  background-image: url("vedic-moon-bg.png");
  background-size: cover;
  background-position: top center;
  background-repeat: no-repeat;
  pointer-events: none;
}

.vedic-reading-page {
  position: relative;
  z-index: 1;
  min-height: 100svh;
  padding:
    calc(env(safe-area-inset-top) + 24px)
    var(--side-pad)
    calc(env(safe-area-inset-bottom) + 24px);
}

.vedic-reading-content {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  animation: vedicFadeIn 240ms ease-out;
}
@keyframes vedicFadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .vedic-reading-content { animation: none; }
  .stage { transition: none; }
}

/* ---------- header ---------- */
.vedic-back-button {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 10px);
  left: calc(var(--side-pad) - 10px);
  width: 44px;
  height: 44px;
  padding: 0;
  margin: 0;
  border: 0;
  background: transparent;
  color: var(--vedic-gold);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.vedic-back-button svg { width: 30px; height: 20px; display: block; }
.vedic-back-button:focus-visible { outline: 1px solid var(--vedic-gold-muted); outline-offset: 4px; border-radius: 4px; }

.vedic-header {
  text-align: center;
  padding-top: 6px;
}
/* His logo lockup (emblem + CozAlyze wordmark) as one image, white keyed out.
   Width is set so the wordmark reads at the spec's 28–30px display size. */
.vedic-logo {
  display: block;
  width: 140px;
  height: auto;
  margin: 0 auto;
}
.vedic-eyebrow {
  font-family: var(--body-font);
  font-size: clamp(13px, 3.5vw, 14.5px);
  font-weight: 500;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--vedic-ivory-muted);
  margin: 12px 0 0;
  padding-left: 0.28em; /* optical centre with the trailing tracking */
}
.vedic-counter {
  font-family: var(--display-font);
  font-size: clamp(27px, 7.2vw, 31px);
  font-weight: 500;
  letter-spacing: 0.06em;
  font-variant-numeric: lining-nums;
  color: var(--vedic-gold);
  margin: 40px 0 0;
}

/* ---------- ornamental divider ---------- */
.vedic-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: min(100%, 420px);
  margin: 14px auto;
  color: var(--vedic-gold);
}
.vedic-divider::before,
.vedic-divider::after {
  content: "";
  flex: 1 1 auto;
  height: 1px;
  background: var(--vedic-gold-muted);
}
.vedic-divider svg { width: 16px; height: 16px; flex: 0 0 auto; display: block; }

/* ---------- title ---------- */
.vedic-title {
  font-family: var(--display-font);
  font-size: clamp(2.6rem, 11.5vw, 3.4rem);
  font-weight: 500;
  line-height: 0.98;
  color: var(--vedic-gold);
  text-align: center;
  text-wrap: balance;
  margin: 10px 0;
}
.vedic-title--long {
  font-size: clamp(2.35rem, 10vw, 2.9rem);
}

/* ---------- body ---------- */
.vedic-body {
  font-family: var(--body-font);
  font-size: clamp(1.25rem, 5.4vw, 1.4rem);
  line-height: 1.55;
  font-weight: 400;
  color: var(--vedic-ivory);
  margin-top: 24px;
}
.vedic-body p { margin: 0 0 1.35em; }
.vedic-body p:last-child { margin-bottom: 0; }
.vedic-subhead {
  font-family: var(--display-font);
  font-size: clamp(1.6rem, 6.4vw, 1.9rem);
  font-weight: 500;
  line-height: 1.12;
  color: var(--vedic-gold);
  text-align: left;
  margin: 1.6em 0 0.7em;
}
.vedic-body .vedic-subhead:first-child { margin-top: 0; }

/* ---------- bottom navigation ---------- */
.vedic-nav { margin-top: 34px; }
.vedic-nav-rule {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--vedic-gold);
}
.vedic-nav-rule::before,
.vedic-nav-rule::after {
  content: "";
  flex: 1 1 auto;
  height: 1px;
  background: var(--vedic-gold-muted);
}
.vedic-nav-rule svg { width: 14px; height: 14px; flex: 0 0 auto; display: block; }
.vedic-nav-links {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding-top: 6px;
}
.vedic-nav a,
.vedic-nav button {
  font-family: var(--body-font);
  font-size: clamp(16px, 4.3vw, 18px);
  font-weight: 400;
  color: var(--vedic-gold);
  text-decoration: none;
  background: transparent;
  border: 0;
  padding: 0;
  margin: 0;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  text-align: left;
}
.vedic-nav a:focus-visible,
.vedic-nav button:focus-visible { outline: 1px solid var(--vedic-gold-muted); outline-offset: 4px; border-radius: 4px; }
.vedic-nav .vedic-nav-next { text-align: right; justify-content: flex-end; }
.vedic-nav svg:not(.vedic-nav-rule svg) { width: 24px; height: 15px; flex: 0 0 auto; }

</style>

<style>
/* VS0.1 voice samples (staging only, not linked): listen to candidate voices for each avatar.
   Clips are each voice's own public preview, played from ElevenLabs' storage; nothing is stored here. */
.vs-avatar { display: block; width: 46%; max-width: 220px; height: auto; margin: 26px auto 8px; border: 1px solid var(--vedic-gold-muted); }
.vs-list { margin: 0 0 8px; }
.vs-voice { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; }
.vs-name { font-family: var(--display-font); font-variant-numeric: lining-nums; font-size: clamp(1.45rem, 6vw, 1.7rem); font-weight: 500; line-height: 1.1; color: var(--vedic-gold); margin: 0; }
.vs-desc { font-family: var(--body-font); font-size: 16px; line-height: 1.35; color: var(--vedic-ivory-muted); margin: 4px 0 0; }
.vs-play {
  flex: 0 0 auto; min-width: 72px; min-height: 44px; padding: 0; margin: 0; border: 0; background: transparent;
  font-family: var(--body-font); font-size: clamp(16px, 4.3vw, 18px); color: var(--vedic-gold); text-align: right;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
</style>

    btn.addEventListener("click", function () {
      var i = +btn.getAttribute("data-i");
      if (current === i) { player.pause(); label(i, "Play"); current = -1; return; }
      if (current >= 0) { player.pause(); label(current, "Play"); }
      current = i;
      if (cache[i]) { start(cache[i], i); return; }
      label(i, "Loading\u2026");
      player.src = SILENT; var u = player.play(); if (u && u.catch) u.catch(function () {});   /* unlocks iPhone audio inside the tap */
      load(i).then(function (url) { if (current === i) start(url, i); })
             .catch(function () { if (current === i) start(voices[i].src, i); });          /* fallback: play the stored file directly */
    });
  });

  /* fetch the twelve clips in the background, three at a time */
  var next = 0;
  function pump() { if (next >= voices.length) return; var i = next++; load(i).then(pump, pump); }
  window.addEventListener("load", function () { pump(); pump(); pump(); });
})();
</script>
</body>
</html>
